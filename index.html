        open.style.cssText = 'display:flex;align-items:center;gap:6px;min-width:0;max-width:190px;text-align:left;';
        const icon = document.createElement('span');
        icon.textContent = isImg ? '▧' : '▤';
        open.appendChild(icon);
        const name = document.createElement('span');
        name.style.cssText = 'max-width:140px;overflow:hidden;text-overflow:ellipsis;';
        name.textContent = String(att.name || 'Attachment');
        open.appendChild(name);
        open.addEventListener('click', () => { void openAttachment(att.id); });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = 'Remove attachment';
        remove.setAttribute('aria-label', `Remove ${String(att.name || 'attachment')}`);
        remove.style.cssText = 'color:var(--text-muted);padding-left:4px;';
        remove.addEventListener('click', event => {
          event.stopPropagation();
          void removeAttachment(att.id);
        });
        pill.append(open, remove);
        grid.appendChild(pill);
      }
    }

    let lightboxObjectUrl = null;

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      const image = document.getElementById('lightbox-img');
      if (lightbox) lightbox.style.display = 'none';
      if (image) image.removeAttribute('src');
      if (lightboxObjectUrl) URL.revokeObjectURL(lightboxObjectUrl);
      lightboxObjectUrl = null;
    }

    function openLightbox(blob) {
      closeLightbox();
      lightboxObjectUrl = URL.createObjectURL(blob);
      document.getElementById('lightbox-img').src = lightboxObjectUrl;
      document.getElementById('lightbox').style.display = 'flex';
    }

    async function getAttachmentBlob(attId) {
      if (!masterCryptoKey) throw new Error('Vault is locked');
      const att = currentAttachments.find(a => a.id === attId);
      if (!att) throw new Error('Attachment metadata not found');
      const record = await dbGet('attachments', attId);
      if (!record) throw new Error('Attachment data not found');
      const plain = await decryptBinary(record, masterCryptoKey);
      if (!masterCryptoKey) throw new Error('Vault is locked');
      return { blob: new Blob([plain], { type: att.type || 'application/octet-stream' }), metadata: att };
    }

    async function openAttachment(attId) {
      try {
        const { blob, metadata } = await getAttachmentBlob(attId);
        if (String(metadata.type || '').startsWith('image/')) openLightbox(blob);
        else downloadAttachmentBlob(blob, metadata.name);
      } catch (err) {
        console.error('Could not open attachment:', err);
        const statusEl = document.getElementById('save-status');
        if (statusEl) {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = 'ATTACHMENT UNAVAILABLE';
        }
      }
    }

    function downloadAttachmentBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = String(filename || 'Attachment');
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    async function downloadAttachment(attId) {
      try {
        const { blob, metadata } = await getAttachmentBlob(attId);
        downloadAttachmentBlob(blob, metadata.name);
      } catch (err) {
        console.error('Could not download attachment:', err);
        const statusEl = document.getElementById('save-status');
        if (statusEl) {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = 'ATTACHMENT UNAVAILABLE';
        }
      }
    }

    async function removeAttachment(attId) {
      const previousAttachments = currentAttachments;
      currentAttachments = previousAttachments.filter(a => a.id !== attId);
      renderAttachments();
      try {
        await saveCurrentNote();
      } catch (err) {
        currentAttachments = previousAttachments;
        renderAttachments();
        console.error('Could not remove attachment metadata:', err);
        return;
      }
      try {
        await dbDelete('attachments', attId);
      } catch (err) {
        // The note no longer references this blob; a failed cleanup leaves only an orphaned ciphertext.
        console.warn('Attachment metadata removed, but encrypted blob cleanup failed:', err);
      }
    }


    /********************************************************************
     * 6. ĐỒNG BỘ HỆ SINH THÁI APPLE (XUẤT / NHẬP FILE .VAULT QUA ICLOUD)
     ********************************************************************/

    // Helper: Kiểm tra tính hợp lệ của cấu trúc file .vault trước khi can thiệp DB
    function validateVaultBackupObject(backup) {
      if (!backup || typeof backup !== 'object' || Array.isArray(backup)) throw new Error('INVALID VAULT FILE'); /////////////////////
      if (backup.app != null && backup.app !== 'AppleSecretVault') throw new Error('UNSUPPORTED VAULT FORMAT');
      if (backup.version != null && ![1, 2].includes(backup.version)) throw new Error('UNSUPPORTED VAULT VERSION');
      if (backup.version === 2 && !Array.isArray(backup.attachments)) throw new Error('INVALID ATTACHMENTS FORMAT');
      const decodeField = (value, label, { exactBytes = null, minBytes = 1 } = {}) => {
        if (typeof value !== 'string' || !value || !/^[A-Za-z0-9+/]+={0,2}$/.test(value)) throw new Error(`CORRUPTED ${label}`);
        let bytes;
        try { bytes = new Uint8Array(base64ToBuffer(value)); } catch (_) { throw new Error(`CORRUPTED ${label}`); }
        if (bytes.length < minBytes || (exactBytes !== null && bytes.length !== exactBytes)) throw new Error(`CORRUPTED ${label}`);
        return bytes.length;
      };
      if (!backup.header || typeof backup.header !== 'object') throw new Error('CORRUPTED HEADER'); ////////////////////////
      decodeField(backup.header.salt, 'SALT', { exactBytes: 16 });
      decodeField(backup.header.verifierIv, 'VERIFIER IV', { exactBytes: 12 });
      decodeField(backup.header.verifierData, 'VERIFIER DATA', { minBytes: 16 });
      if (!Array.isArray(backup.notes)) throw new Error('INVALID NOTES FORMAT');
      const ids = new Set();
      for (const n of backup.notes) {
        if (!n || typeof n.id !== 'string' || !n.id.trim()) throw new Error('CORRUPTED NOTE RECORD');
        if (ids.has(n.id)) throw new Error('DUPLICATE NOTE ID');
        ids.add(n.id);
        decodeField(n.iv, 'NOTE IV', { exactBytes: 12 });
        decodeField(n.data, 'NOTE DATA', { minBytes: 16 });
        if (n.updatedAt != null && (!Number.isFinite(Number(n.updatedAt)) || Number(n.updatedAt) < 0)) throw new Error('CORRUPTED NOTE TIMESTAMP');
      }
      const attachmentIds = new Set();
      for (const att of (backup.attachments || [])) {
        if (!att || typeof att.id !== 'string' || !att.id.trim()) throw new Error('CORRUPTED ATTACHMENT RECORD');
        if (attachmentIds.has(att.id)) throw new Error('DUPLICATE ATTACHMENT ID');
        attachmentIds.add(att.id);
        decodeField(att.iv, 'ATTACHMENT IV', { exactBytes: 12 });
        decodeField(att.data, 'ATTACHMENT DATA', { minBytes: 16 });
      }
      return true;
    }

    // Replace header, notes and encrypted attachment blobs in one transaction.
    function atomicReplaceVault(headerObj, notesArray, attachmentsArray = []) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(['meta', 'notes', 'attachments'], 'readwrite');
        const metaStore = tx.objectStore('meta');
        const notesStore = tx.objectStore('notes');
        const attachmentsStore = tx.objectStore('attachments');

        metaStore.clear();
        notesStore.clear();
        attachmentsStore.clear();
        metaStore.put({ ...headerObj, key: 'vault_header' });
        for (const n of notesArray) notesStore.put(n);
        for (const att of attachmentsArray) attachmentsStore.put(attachmentRecordForDatabase(att));

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('TRANSACTION FAILED'));
        tx.onabort = () => reject(tx.error || new Error('TRANSACTION ABORTED'));
      });
    }

    // Helper: Xóa trắng Vault trong 1 Transaction nguyên tử
    function atomicClearVault() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(['meta', 'notes', 'attachments'], 'readwrite');
        tx.objectStore('meta').clear();
        tx.objectStore('notes').clear();
        tx.objectStore('attachments').clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('TRANSACTION ABORTED'));
      });
    }

    function atomicDeleteNoteAndAttachments(note) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(['notes', 'attachments'], 'readwrite');
        tx.objectStore('notes').delete(note.id);
        const attachmentStore = tx.objectStore('attachments');
        for (const att of (Array.isArray(note.attachments) ? note.attachments : [])) {
          if (att && typeof att.id === 'string') attachmentStore.delete(att.id);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('TRANSACTION FAILED'));
        tx.onabort = () => reject(tx.error || new Error('TRANSACTION ABORTED'));
      });
    }

    // Export can rescue a vault even when IndexedDB is full: unlocked notes are encrypted
    // from RAM for the payload, without needing another write to persistent storage.
    async function exportEncryptedVault() {
      await initDB();
      let notes;
      let exportedFromRAM = false;

      if (masterCryptoKey) {
        const key = masterCryptoKey;
        const queueBeforeExport = noteSaveQueue;
        if (currentNoteId) {
          try {
            await saveCurrentNote();
          } catch (err) {
            exportedFromRAM = true;
            console.warn('Note save failed before export; continuing from RAM:', err);
          }
        }
        try { await queueBeforeExport; }
        catch (err) {
          exportedFromRAM = true;
          console.warn('A queued write failed before export; continuing from RAM:', err);
        }
        try { await noteSaveQueue; }
        catch (err) {
          exportedFromRAM = true;
          console.warn('Vault sync failed before export; continuing from RAM:', err);
        }
        if (masterCryptoKey !== key) throw new Error('Vault locked during export. Please unlock and export again.');

        const noteSnapshots = decryptedNotes.map(note => JSON.parse(JSON.stringify(note)));
        notes = [];
        for (const note of noteSnapshots) {
          // Do not re-introduce a note that was deleted while encryption was in progress.
          if (!decryptedNotes.some(current => current.id === note.id)) continue;
          const enc = await encryptObject(note, key);
          if (!decryptedNotes.some(current => current.id === note.id)) continue;
          notes.push({
            id: note.id,
            updatedAt: note.updatedAt || Date.now(),
            iv: enc.iv,
            data: enc.data
          });
        }
        if (exportedFromRAM) {
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.style.color = 'var(--warning)';
            statusEl.textContent = 'EXPORTED FROM RAM — CHECK STORAGE'; ////////////////////////
          }
        }
      } else {
        notes = await dbGetAll('notes');
      }

      const header = await dbGet('meta', 'vault_header');
      if (!header) return;
      const attachmentRecords = await dbGetAll('attachments');
      const attachments = attachmentRecords.map(att => ({
        id: att.id,
        iv: att.iv,
        data: bufferToBase64(att.data)
      }));

      const payload = {
        app: 'AppleSecretVault',
        version: 2,
        exportedAt: Date.now(),
        header,
        notes,
        attachments
      };

      // Verify both the in-memory object and its serialized representation before export.
      validateVaultBackupObject(payload);
      const serializedPayload = JSON.stringify(payload);
      validateVaultBackupObject(JSON.parse(serializedPayload));
      const blob = new Blob([serializedPayload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateTag = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `SecretVault_${dateTag}.vault.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    // Khôi phục từ màn hình khóa (An toàn với Atomic Transaction)
    async function restoreVaultFromLockScreen(event) {
      const file = event.target.files && event.target.files[0];
      try { await restoreVaultFile(file); }
      finally { if (event.target) event.target.value = ''; }

    async function restoreVaultFile(file) {
      if (!file) return;
      const statusEl = document.getElementById('auth-status');
      try {
        const text = await file.text();
        const backup = JSON.parse(text);
        validateVaultBackupObject(backup);
        await initDB();
        const existingHeader = await dbGet('meta', 'vault_header');
        if (existingHeader && !confirm('A vault already exists in this browser. Replacing it will overwrite the current vault. Continue?')) {
          statusEl.textContent = 'IMPORT CANCELLED';
          return;
        }
        notifyVaultSync('import', 'Vault replacement');
        await atomicReplaceVault(backup.header, backup.notes, backup.attachments || []);
        await checkVaultState();
        statusEl.innerHTML = '<span class="rainbow-text">LOADED</span>'; /////////////////////
      } catch (err) {
        statusEl.textContent = err.message ? err.message.toUpperCase() : 'IMPORT FAILED'; ///////////////////
      }
    }

    // Allow dropping a .vault/JSON backup anywhere on the lock screen (desktop browsers).
    (() => {
      const lockScreen = document.getElementById('lock-screen');
      if (!lockScreen) return;
      let dragDepth = 0;
      lockScreen.addEventListener('dragenter', event => {
        if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
        event.preventDefault(); dragDepth++; lockScreen.classList.add('file-drag-over');
      });
      lockScreen.addEventListener('dragover', event => {
        if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
        event.preventDefault(); event.dataTransfer.dropEffect = 'copy'; lockScreen.classList.add('file-drag-over');
      });
      lockScreen.addEventListener('dragleave', event => {
        if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) lockScreen.classList.remove('file-drag-over');
      });
      lockScreen.addEventListener('drop', async event => {
        if (!event.dataTransfer || !event.dataTransfer.files?.length) return;
        event.preventDefault(); event.stopPropagation(); dragDepth = 0; lockScreen.classList.remove('file-drag-over');
        const file = Array.from(event.dataTransfer.files).find(item => /\.vault$|\.json$/i.test(item.name) || item.type === 'application/json');
        if (file) await restoreVaultFile(file);
        else document.getElementById('auth-status').textContent = 'PLEASE DROP A .VAULT OR JSON FILE';
      });
    })();

    // Nhập và gộp toàn bộ file .vault khi đang mở khóa (Giữ tất cả, không lo trùng ID)
    let pendingMergeBackup = null;

    async function importAndMergeVault(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const backup = JSON.parse(text);
        validateVaultBackupObject(backup);
        pendingMergeBackup = backup;

        openVaultModal({
          title: 'IMPORT VAULT',

              <button type="button" class="btn-modal" onclick="closeVaultModal()">CANCEL</button>

            </div>
          `
        });
      } catch (err) {

        if (statusEl) {
          statusEl.style.color = 'var(--danger)';

    async function executeMergeVault() {
      if (!pendingMergeBackup || !masterCryptoKey) return;
      const pass = document.getElementById('vault-modal-pass').value;
      const statusEl = document.getElementById('vault-modal-status');

      if (!pass) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'ENTER PASSWORD';
        return;
      }

      statusEl.style.color = '#ffd60a';
      statusEl.textContent = 'MERGING...';
      await new Promise(r => setTimeout(r, 40));
      const appContainer = document.getElementById('app-container');
      let maintenanceStarted = false;

      try {
        const backup = pendingMergeBackup;
        const backupSalt = new Uint8Array(base64ToBuffer(backup.header.salt));
        const backupKey = await deriveKeyFromPassword(pass, backupSalt);
        const check = await decryptObject(backup.header.verifierIv, backup.header.verifierData, backupKey);
        if (check.magic !== MAGIC_VERIFIER) throw new Error('INVALID PASSWORD');

        if (currentNoteId) await saveCurrentNote();
        isVaultMaintenance = true;
        maintenanceStarted = true;
        if (appContainer) appContainer.inert = true;
        try {
          await noteSaveQueue;
        } catch (queueError) {
          console.warn('Retrying RAM notes before vault merge:', queueError);
          await persistDecryptedNotesToDB(masterCryptoKey);
          noteSaveQueue = Promise.resolve();
        }

        // Lock peer tabs before adding data to the shared vault.
        notifyVaultSync('import', 'Vault merge');
        const backupAttachments = new Map((backup.attachments || []).map(att => [att.id, att]));
        const reEncryptedRecords = [];
        const reEncryptedAttachments = [];

        for (let i = 0; i < backup.notes.length; i++) {
          const rawNote = backup.notes[i];
          const noteObj = await decryptObject(rawNote.iv, rawNote.data, backupKey);
          const newId = `note_${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${i}`;
          const attachmentMetadataList = [];

          for (const sourceAtt of (Array.isArray(noteObj.attachments) ? noteObj.attachments : [])) {
            let plainBytes;
            if (typeof sourceAtt?.data === 'string') {
              // Version 1 backup: the old encrypted note contains Base64 file bytes.
              plainBytes = base64ToBuffer(sourceAtt.data);
            } else {
              const sourceRecord = backupAttachments.get(sourceAtt?.id);
              if (!sourceRecord) throw new Error('MISSING ATTACHMENT DATA');
              plainBytes = await decryptBinary(sourceRecord, backupKey);
            }

            const importedAttachmentId = newAttachmentId();
            const encryptedAttachment = await encryptBinary(plainBytes, masterCryptoKey, importedAttachmentId);
            reEncryptedAttachments.push(encryptedAttachment);
            attachmentMetadataList.push(attachmentMetadata(sourceAtt, importedAttachmentId));
          }

          const mergedNote = {
            ...noteObj,
            id: newId,
            attachments: attachmentMetadataList,
            updatedAt: noteObj.updatedAt || Date.now()
          };
          const reEncrypted = await encryptObject(mergedNote, masterCryptoKey);
          reEncryptedRecords.push({
            id: mergedNote.id,
            updatedAt: mergedNote.updatedAt,
            iv: reEncrypted.iv,
            data: reEncrypted.data
          });
        }

        await enqueueNoteSave(() => new Promise((resolve, reject) => {
          const tx = db.transaction(['notes', 'attachments'], 'readwrite');
          const noteStore = tx.objectStore('notes');
          const attachmentStore = tx.objectStore('attachments');
          for (const rec of reEncryptedRecords) noteStore.put(rec);
          for (const att of reEncryptedAttachments) attachmentStore.put(att);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error('TRANSACTION FAILED'));
          tx.onabort = () => reject(tx.error || new Error('TRANSACTION ABORTED'));
        }));

        pendingMergeBackup = null;
        closeVaultModal();
        await loadAllNotesIntoRAM();
        renderNoteList();
      } catch (err) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = String(err.message || 'IMPORT FAILED').toUpperCase();
        console.error('Vault merge failed:', err);
      } finally {
        if (maintenanceStarted) {
          isVaultMaintenance = false;
          if (appContainer && !isVaultLocking) appContainer.inert = false;
        }
      }
    }

    /* Xác thực xong mới cho phép nhập mật khẩu mới */
    async function verifyCurrentPasswordForChange() {
      const passInput = document.getElementById('vault-modal-pass');
      const statusEl = document.getElementById('vault-modal-status');
      const currentPass = passInput.value;

      if (!currentPass) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'PASSWORD REQUIRED';
        return;
      }

      try {
        const header = await dbGet('meta', 'vault_header');
        if (!header) throw new Error('Vault header missing');

        const currentSalt = new Uint8Array(
          base64ToBuffer(header.salt)
        );

        const currentKey = await deriveKeyFromPassword(
          currentPass,
          currentSalt
        );

        const check = await decryptObject(
          header.verifierIv,
          header.verifierData,
          currentKey
        );

        if (check.magic !== MAGIC_VERIFIER) {
          throw new Error('Invalid password');
        }
      } catch (_) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'CURRENT PASSWORD IS INCORRECT';
        passInput.value = '';
        passInput.focus();
        return;
      }

      // Giữ nguyên thông báo đồng bộ sau khi xác thực thành công
      notifyVaultSync('password-change', 'Master password change');

      // Chuyển sang modal nhập mật khẩu mới và xác nhận
      openVaultModal({
        title: 'NEW PASSWORD',
        showConfirmPass: true,
        actionsHtml: `

              type="button"
              class="btn-modal"
              onclick="closeVaultModal()"
            >
              CANCEL
            </button>

              type="button"
              class="btn-modal primary"
              onclick="executeChangePassword()"
            >
              SAVE
            </button>
          </div>
        `
      });
    }


    async function executeChangePassword() {
      const newPass = document.getElementById('vault-modal-pass').value;
      const confirmPass = document.getElementById('vault-modal-pass-confirm').value;
      const statusEl = document.getElementById('vault-modal-status');

      if (!newPass || newPass.length < 1) { //////////////////////
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'PASSWORD REQUIRED';
        return;
      }
      if (newPass !== confirmPass) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'MISMATCH';
        return;
      }

      statusEl.style.color = '#ffd60a';
      statusEl.textContent = 'ENCRYPTING...';
      await new Promise(r => setTimeout(r, 40));
      const appContainer = document.getElementById('app-container');
      let maintenanceStarted = false;

      try {
        if (currentNoteId) await saveCurrentNote();
        isVaultMaintenance = true;
        maintenanceStarted = true;
        if (appContainer) appContainer.inert = true;
        try {
          await noteSaveQueue;
        } catch (queueError) {
          console.warn('Retrying RAM notes before password rotation:', queueError);
          await persistDecryptedNotesToDB(masterCryptoKey);
          noteSaveQueue = Promise.resolve();
        }
        notifyVaultSync('password-change', 'Master password change');
        // The user has already had time to enter the new password after the first notification.
        // Reload persisted notes so writes completed by peer tabs are included in the key rotation.
        await loadAllNotesIntoRAM();

        const newSalt = crypto.getRandomValues(new Uint8Array(16));
        const newKey = await deriveKeyFromPassword(newPass, newSalt);
        const verifier = await encryptObject({ magic: MAGIC_VERIFIER, createdAt: Date.now() }, newKey);

        const newHeader = {
          key: 'vault_header',
          salt: bufferToBase64(newSalt.buffer),
          verifierIv: verifier.iv,
          verifierData: verifier.data
        };

        const reEncryptedNotes = [];
        for (const note of decryptedNotes) {
          const enc = await encryptObject(note, newKey);
          reEncryptedNotes.push({
            id: note.id,
            updatedAt: note.updatedAt,
            iv: enc.iv,
            data: enc.data
          });
        }

        const reEncryptedAttachments = [];
        for (const record of await dbGetAll('attachments')) {
          const plainBytes = await decryptBinary(record, masterCryptoKey);
          reEncryptedAttachments.push(await encryptBinary(plainBytes, newKey, record.id));
        }

        await enqueueNoteSave(async () => {
          await atomicReplaceVault(newHeader, reEncryptedNotes, reEncryptedAttachments);
          masterCryptoKey = newKey;
          vaultSalt = newSalt;
        });
        closeVaultModal();
      } catch (err) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = String(err.message || 'ERROR').toUpperCase();
        console.error('Master password change failed:', err);
      } finally {
        if (maintenanceStarted) {
          isVaultMaintenance = false;
          if (appContainer && !isVaultLocking) appContainer.inert = false;
        }
      }
    }

    // Tự hủy: Yêu cầu nhập mật khẩu Vault + 3 lựa chọn (Cancel / Confirm / Export & Confirm)
    function panicWipeVault() {

            <button type="button" class="btn-modal danger" onclick="executeSelfDestruct(false)">CONFIRM</button>

    async function executeSelfDestruct(shouldExportFirst) {
      const pass = document.getElementById('vault-modal-pass').value;
      const statusEl = document.getElementById('vault-modal-status');

      if (!pass) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'ENTER PASSWORD';
        return;
      }

      statusEl.style.color = '#ffd60a';
      statusEl.textContent = 'VERIFYING...';
      await new Promise(r => setTimeout(r, 40));

      try {
        const header = await dbGet('meta', 'vault_header');
        if (header) {
          const salt = new Uint8Array(base64ToBuffer(header.salt));
          const key = await deriveKeyFromPassword(pass, salt);
          const check = await decryptObject(header.verifierIv, header.verifierData, key);
          if (check.magic !== MAGIC_VERIFIER) throw new Error('INVALID PASSWORD');
        }

        if (shouldExportFirst) {
          statusEl.textContent = 'EXPORTING...';
          await exportEncryptedVault();
        }

        notifyVaultSync('import', 'Vault destruction');
        if (noteAutoSaveTimer) { clearTimeout(noteAutoSaveTimer); noteAutoSaveTimer = null; }
        // Let writes already in flight finish before the atomic clear; the clear must be last.
        await noteSaveQueue.catch(() => {});
        await atomicClearVault();
        closeVaultModal();
        await lockVault(shouldExportFirst ? 'EXPORTED & DESTROYED' : 'VAULT DESTROYED', { skipSave: true });
      } catch (err) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = err && err.message ? err.message.toUpperCase() : 'SELF-DESTRUCT FAILED';
        console.error('Self-destruct failed:', err);
      }
    }

    // Tự động khóa khi không thao tác hoặc khi ẩn ứng dụng trên iPhone
    let lastActiveTimestamp = Date.now();
    let autoLockInProgress = false;
    function resetInactivityTimer() {
      lastActiveTimestamp = Date.now();
      inactivitySeconds = 180; /////////////////////
    }

    function startAutoLockTimer() {
      clearInterval(timerInterval);
      lastActiveTimestamp = Date.now();
      autoLockInProgress = false;
      const ind = document.getElementById('autolock-indicator');
      const tick = () => {
        if (!masterCryptoKey || autoLockInProgress || isVaultMaintenance) return;
        const remaining = Math.max(0, 180 - Math.floor((Date.now() - lastActiveTimestamp) / 1000)); /////////////////////
        inactivitySeconds = remaining;
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const sec = String(remaining % 60).padStart(2, '0');
        if (ind) ind.textContent = `${m}:${sec}`;
        if (remaining <= 0) {
          autoLockInProgress = true;
          void lockVault('Tự động khóa do không hoạt động.');
        }
      };
      timerInterval = setInterval(tick, 1000);
      tick();
    }

    // Timers are throttled/frozen in background tabs, so wall-clock checks are mandatory.
    ['visibilitychange', 'pageshow', 'focus'].forEach(evt => {
      const target = evt === 'visibilitychange' ? document : window;
      target.addEventListener(evt, () => {
        if (masterCryptoKey && !isVaultMaintenance && (evt !== 'visibilitychange' || !document.hidden)) {
          const elapsed = Date.now() - lastActiveTimestamp;
          if (elapsed >= 180000) { /////////////////////////////
            if (!autoLockInProgress) {
              autoLockInProgress = true;
              void lockVault('Tự động khóa do không hoạt động.');
            }
          } else if (evt !== 'visibilitychange') {
            // Do not count time spent in background as user activity.
            const ind = document.getElementById('autolock-indicator');
            const remaining = Math.max(0, 180 - Math.floor(elapsed / 1000));
            if (ind) ind.textContent = `${String(Math.floor(remaining / 60)).padStart(2,'0')}:${String(remaining % 60).padStart(2,'0')}`;
          }
        }
      });
    });

    ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (masterCryptoKey) resetInactivityTimer();
      }, { passive: true });
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function resetVaultToInitialState() {
      const ok = confirm(
        'Xóa toàn bộ kho Secret Vault trên trình duyệt này và tạo lại từ đầu?'
      );
      if (!ok) return;

      await initDB();
      notifyVaultSync('import', 'Vault reset');
      await dbClear('meta');
      await dbClear('notes');
      await dbClear('attachments');

      masterCryptoKey = null;
      vaultSalt = null;
      decryptedNotes = [];
      currentNoteId = null;
      currentAttachments = [];

      location.reload();
    }

    // Khởi động ứng dụng & kích hoạt vùng Kéo Thả (Phase 4)
    initAttachmentDragAndDrop();
    checkVaultState();

  </script>
