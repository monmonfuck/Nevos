    async function lockVault(reason = '', options = {}) {
      if (isVaultLocking || isVaultMaintenance) return false;
      if (!options.remote) notifyVaultSync('lock', reason);
      isVaultLocking = true;
      const appContainer = document.getElementById('app-container');
      if (appContainer) appContainer.inert = true;
      const skipSave = options.skipSave === true;
      if (!skipSave && currentNoteId && masterCryptoKey && document.getElementById('editor-content').style.display === 'flex') {
        try {
          await saveCurrentNote();
        } catch (err) {
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'LOCK CANCELLED — SAVE FAILED';
          }
          console.error('Save before locking failed:', err);
          autoLockInProgress = false;
          lastActiveTimestamp = Date.now();
          isVaultLocking = false;
          if (appContainer) appContainer.inert = false;
          alert('Không thể khóa kho vì lưu Note thất bại. Dữ liệu vẫn được giữ trên màn hình; hãy sao chép nội dung quan trọng hoặc thử lưu lại trước khi khóa.'); ///////////
          return false;
        }
      }

      // Drain queued writes before clearing the key and in-memory notes. A normal lock
      // must abort on a failed write; destructive wipe intentionally ignores old errors.
      try {
        if (skipSave) {
          await noteSaveQueue.catch(() => {});
        } else {
          try {
            await noteSaveQueue;
          } catch (queueError) {
            // A rejected promise can be stale. Re-persist RAM before allowing a lock;
            // do not merely replace the promise and erase the only copy of recent edits.
            console.warn('Retrying RAM notes after a failed queued write before locking:', queueError); //////////
            await persistDecryptedNotesToDB(masterCryptoKey);
            noteSaveQueue = Promise.resolve();
          }
        }
      } catch (err) {
        const statusEl = document.getElementById('save-status');
        if (statusEl) {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = 'LOCK CANCELLED — SAVE FAILED'; //////////////////////////////
        }
        console.error('Pending note write failed before locking:', err);
        autoLockInProgress = false;
        lastActiveTimestamp = Date.now();
        isVaultLocking = false;
        if (appContainer) appContainer.inert = false;
        alert('Không thể khóa kho vì có thao tác lưu chưa hoàn tất. Dữ liệu vẫn được giữ trong RAM; hãy sao chép nội dung quan trọng hoặc thử lưu lại.'); /////////////////////////
        return false;
      }

      closeNoteActionWheel();
      closeSheetColorMenu();
      sheetSelection = null;
      sheetPointerSelection = null;
      if (noteAutoSaveTimer) { clearTimeout(noteAutoSaveTimer); noteAutoSaveTimer = null; }
      masterCryptoKey = null;
      decryptedNotes = [];
      currentNoteId = null;
      unlockedSessionNoteId = null;
      currentAttachments = [];
      closeLightbox();
      clearInterval(timerInterval);

      document.getElementById('note-list').innerHTML = '';
      document.getElementById('note-title').value = '';
      document.getElementById('note-secret').value = '';
      document.getElementById('note-body').value = '';
      document.getElementById('attachment-grid').innerHTML = '';
      const tableGridOnLock = document.getElementById('note-table-grid');
      if (tableGridOnLock) tableGridOnLock.innerHTML = '';
      const tableWrapOnLock = document.getElementById('note-table-wrap');
      if (tableWrapOnLock) tableWrapOnLock.style.display = 'none';
      document.getElementById('editor-content').style.display = 'none';
      document.getElementById('note-lock-view').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('lock-screen').style.display = 'flex';

      checkVaultState();
      if (reason) {
        const statusEl = document.getElementById('auth-status');
        statusEl.style.color = 'var(--warning)';
        statusEl.textContent = '🔒 ' + reason;
      }
      return true;
    }

    function renderNoteList() {
      const listEl = document.getElementById('note-list');
      const searchEl = document.getElementById('search-input');
      const query = searchEl ? searchEl.value.trim().toLowerCase() : '';
      listEl.innerHTML = '';
      sortNotesArray();

      const filtered = decryptedNotes.filter(n => {
        if (currentCategoryFilter === 'STARRED' && !n.starred) return false;
        if (['TEXT', 'IMAGE', 'FILE', 'SEED', 'TABLE'].includes(currentCategoryFilter) && n.category !== currentCategoryFilter) return false;
        if (!query) return true;
        const matchTitle = (n.title || '').toLowerCase().includes(query);
        // Do not search the content of a note that has its own password.
        const hasPass = Boolean(n.secret && n.secret.trim());

        return matchTitle || matchBody;
      });

      if (!filtered.length) {

        card.setAttribute('aria-selected', note.id === currentNoteId ? 'true' : 'false');

        const diff = Math.floor((Date.now() - (note.updatedAt || Date.now())) / 60000);
        const timeStr = diff < 1 ? 'Now' : diff < 60 ? `${diff}m` : diff < 1440 ? `${Math.floor(diff / 60)}h` : new Date(note.updatedAt).toLocaleDateString();
        const typeIcon = CATEGORY_ICONS[note.category] || CATEGORY_ICONS.TEXT;
        const lockBadge = (note.secret && note.secret.trim())
          ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>' : '';
        const pinBadge = note.pinned
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>' : '';
        const starBadge = note.starred
          ? '<svg width="12" height="12" fill="#ffd60a" viewBox="0 0 24 24"><path d="M17 14.14L18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2 15.09 8.26 22 9.27z"></path></svg>' : '';

        card.innerHTML = `
          <div class="note-card-icon ${note.pinned ? 'pin-drag-handle' : ''}" title="${note.pinned ? 'Hold and drag to reorder or use the action dot' : 'Hold and drag to classify or use the action dot'}">${typeIcon}</div>
          <div class="note-card-info">
            <div class="note-card-title">
              <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(note.title || 'Untitled')}</span>
              <span class="note-card-badges">${lockBadge}${pinBadge}${starBadge}</span>
            </div>
            <div class="note-card-meta"><span>${catNames[note.category] || 'Text'}</span> • <span>${timeStr}</span></div>
          </div>`;

        attachNoteCardDrag(card, note);
        card.addEventListener('click', () => {
          if (card.dataset.justDragged === '1') return;
          selectNote(note.id);
        });
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectNote(note.id);
          }
        });
        listEl.appendChild(card);
      });
    }

    // A single Pointer Events drag session prevents two notes from responding at once.
    // Dragging starts from the note card's usable surface (not just its icon); restore on release.
    let noteDragSession = null;
    let noteDragHoldTimer = null;
    let noteAutoSaveTimer = null;
    let noteSaveQueue = Promise.resolve();
    let isVaultMaintenance = false;

    function enqueueNoteSave(work) {
      const task = noteSaveQueue.catch(() => {}).then(work);
      noteSaveQueue = task;
      return task;
    }

    // Retry persistence from the authoritative in-memory vault after a queued write fails.
    // This avoids silently discarding RAM-only edits just to clear a rejected queue.
    async function persistDecryptedNotesToDB(key = masterCryptoKey) {
      if (!key) throw new Error('Vault key unavailable');
      const noteIds = decryptedNotes.map(note => note.id);
      for (const noteId of noteIds) {
        const note = decryptedNotes.find(item => item.id === noteId);
        if (!note) continue;
        const encrypted = await encryptObject(note, key);
        if (!decryptedNotes.some(item => item.id === noteId)) continue;
        await dbPut('notes', {
          id: note.id,
          updatedAt: note.updatedAt || Date.now(),
          iv: encrypted.iv,
          data: encrypted.data
        });
      }
    }

    function clearNoteDragHold() {
      if (noteDragHoldTimer) clearTimeout(noteDragHoldTimer);
      noteDragHoldTimer = null;
    }

    function clearNoteDropTargets() {
      document.querySelectorAll('.pill.drag-over').forEach(el => el.classList.remove('drag-over'));
      document.querySelectorAll('.note-action-item.drag-over').forEach(el => el.classList.remove('drag-over'));
      const dot = document.getElementById('note-action-dot');
      if (dot) dot.classList.remove('drag-over');
    }

    function createNoteDragGhost(session) {
      const ghost = session.cardEl.cloneNode(true);
      ghost.className = 'note-drag-ghost';
      ghost.removeAttribute('role');
      ghost.removeAttribute('tabindex');
      ghost.setAttribute('aria-hidden', 'true');
      ghost.style.width = `${session.cardRect.width}px`;
      ghost.style.height = `${session.cardRect.height}px`;
      ghost.style.left = `${session.cardRect.left}px`;
      ghost.style.top = `${session.cardRect.top}px`;
      ghost.querySelectorAll('button, input, textarea, select, a').forEach(el => el.setAttribute('tabindex', '-1'));
      document.body.appendChild(ghost);
      return ghost;
    }

    function pointNearActionDot(x, y) {
      const dot = document.getElementById('note-action-dot');
      if (!dot) return false;
      const rect = dot.getBoundingClientRect();
      return x >= rect.left - 26 && x <= rect.right + 26 && y >= rect.top - 26 && y <= rect.bottom + 26;
    }

    function pointInsideActionWheelZone(x, y) {
      // Keep the hit zone available while hidden so re-entering it can reveal the wheel again.
      if (!actionWheelCenter) return false;
      return Math.hypot(x - actionWheelCenter.x, y - actionWheelCenter.y) <= actionWheelRadius + 42;
    }

    function pointInsideActionFeature(x, y) {
      return pointNearActionDot(x, y) || pointInsideActionWheelZone(x, y);
    }

    function updateNoteDropHighlight(session, x, y) {
      clearNoteDropTargets();
      const hovered = document.elementFromPoint(x, y);
      const pill = hovered && hovered.closest ? hovered.closest('.category-pills .pill') : null;
      if (pill) pill.classList.add('drag-over');
      const dot = document.getElementById('note-action-dot');
      if (dot && pointNearActionDot(x, y)) dot.classList.add('drag-over');

      const wheel = document.getElementById('note-action-wheel');
      if (pointInsideActionFeature(x, y)) {
        if (!wheel.classList.contains('show') || actionWheelNoteId !== session.note.id) {
          openNoteActionWheel(session.note.id);
        }
      } else if (wheel.classList.contains('show') && actionWheelNoteId === session.note.id) {
        closeNoteActionWheel();
      }

      const hitAfterWheelUpdate = document.elementFromPoint(x, y);
      const actionItem = hitAfterWheelUpdate && hitAfterWheelUpdate.closest
        ? hitAfterWheelUpdate.closest('#note-action-wheel .note-action-item') : null;
      if (actionItem) actionItem.classList.add('drag-over');
    }

    function movePinnedCard(cardEl, y) {
      const list = document.getElementById('note-list');
      if (!list || !list.contains(cardEl)) return;
      const pinnedCards = Array.from(list.querySelectorAll('.note-card[data-pinned="1"]')).filter(el => el !== cardEl);
      const before = pinnedCards.find(el => {
        const rect = el.getBoundingClientRect();
        return y < rect.top + rect.height / 2;
      });
      if (before) {
        if (before !== cardEl.nextElementSibling) list.insertBefore(cardEl, before);
      } else if (pinnedCards.length) {
        const last = pinnedCards[pinnedCards.length - 1];
        if (last.nextElementSibling !== cardEl) list.insertBefore(cardEl, last.nextElementSibling);
      }
    }

    function startNotePointerDrag(session) {
      if (noteDragSession !== session || session.phase !== 'pending') return;
      clearNoteDragHold();
      if (isNoteLocked(session.note)) return;
      session.phase = 'dragging';
      session.moved = false;
      session.cardEl.dataset.justDragged = '1';
      session.cardEl.classList.add('note-drag-source', session.note.pinned ? 'dragging-pin' : 'dragging-note');
      document.body.classList.add('note-drag-active');
      try { document.getSelection()?.removeAllRanges(); } catch (_) {}
      session.ghost = createNoteDragGhost(session);
      // Capture after drag activation so the pointer stream remains consistent outside the icon.
      try { session.handle.setPointerCapture(session.pointerId); } catch (_) {}
    }

    function attachNoteCardDrag(cardEl, note) {
      // Pointer Events on the card make the whole row an effective drag target.
      // Buttons/inputs remain interactive and a normal tap still opens the note.
      const handle = cardEl;
      handle.setAttribute('draggable', 'false');
      handle.setAttribute('aria-label', note.pinned ? 'Hold and drag this note to reorder or use actions' : 'Hold and drag this note to classify or use actions'); ///////////////
      const icon = cardEl.querySelector('.note-card-icon');
      if (icon) icon.title = note.pinned ? 'Hold and drag this note to reorder or use actions' : 'Hold and drag this note to classify or use actions';

      handle.addEventListener('dragstart', e => e.preventDefault());
      handle.addEventListener('pointerdown', e => {
        if (e.button !== undefined && e.button !== 0) return;
        if (noteDragSession) return;
        if (e.target.closest('button, input, textarea, select, a')) return;
        const cardRect = cardEl.getBoundingClientRect();
        const session = {
          cardEl, handle, note, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          grabX: e.clientX - cardRect.left, grabY: e.clientY - cardRect.top,
          cardRect, phase: 'pending', moved: false, ghost: null, pointerType: e.pointerType,
          scrollStartTop: null,
          isProtectedLocked: isNoteLocked(note)
        };
        noteDragSession = session;
        clearNoteDragHold();
        noteDragHoldTimer = setTimeout(() => startNotePointerDrag(session), 200); /////////////////////////
      });
    }

    document.addEventListener('pointermove', e => {
      const session = noteDragSession;
      if (!session || e.pointerId !== session.pointerId) return;
      const distance = Math.hypot(e.clientX - session.startX, e.clientY - session.startY);
      if (session.phase === 'pending') {
        if (distance > 18) {
          clearNoteDragHold();
          if (session.pointerType === 'touch') {
            // The card uses touch-action:none for reliable long-press dragging, so
            // reproduce normal list scrolling when the user moves before the hold delay.
            session.phase = 'scrolling';
            const list = document.getElementById('note-list');
            session.scrollStartTop = list ? list.scrollTop : 0;
            session.cardEl.dataset.justDragged = '1';
            setTimeout(() => { delete session.cardEl.dataset.justDragged; }, 420);
          } else {
            noteDragSession = null;
            return;
          }
        } else {
          return;
        }
      }
      if (session.phase === 'scrolling') {
        const list = document.getElementById('note-list');
        if (list) list.scrollTop = session.scrollStartTop - (e.clientY - session.startY);
        e.preventDefault();
        return;
      }
      if (session.phase !== 'dragging') return;
      e.preventDefault();
      session.moved = session.moved || distance > 5;
      if (session.ghost) {
        if (!session.isProtectedLocked && distance > 42) session.ghost.classList.add('compact');
        const compact = session.ghost.classList.contains('compact');
        session.ghost.style.left = `${compact ? e.clientX - 22 : e.clientX - session.grabX}px`;
        session.ghost.style.top = `${compact ? e.clientY - 22 : e.clientY - session.grabY}px`;
      }

      updateNoteDropHighlight(session, e.clientX, e.clientY);
      const hovered = document.elementFromPoint(e.clientX, e.clientY);
      const overPill = hovered && hovered.closest && hovered.closest('.category-pills .pill');
      const overActionFeature = pointInsideActionFeature(e.clientX, e.clientY);
      if (session.note.pinned && !overPill && !overActionFeature) {
        movePinnedCard(session.cardEl, e.clientY);
        try { session.handle.setPointerCapture(e.pointerId); } catch (_) {}
      }
    }, { passive: false });

    async function finishNotePointer(e, cancelled = false) {
      const session = noteDragSession;
      if (!session || e.pointerId !== session.pointerId) return;
      clearNoteDragHold();
      if (session.phase !== 'dragging') {
        noteDragSession = null;
        return;
      }

      const dropX = e.clientX;
      const dropY = e.clientY;
      const hovered = document.elementFromPoint(dropX, dropY);
      const pill = hovered && hovered.closest ? hovered.closest('.category-pills .pill') : null;
      const actionItem = hovered && hovered.closest ? hovered.closest('#note-action-wheel .note-action-item') : null;
      const dot = document.getElementById('note-action-dot');
      const droppedOnDot = pointNearActionDot(dropX, dropY);
      const noteId = session.note.id;
      const wasPinned = Boolean(session.note.pinned);
      const shouldPersistPinnedOrder = wasPinned && session.moved && document.getElementById('note-list')?.contains(session.cardEl);
      const isProtectedLocked = session.isProtectedLocked;

      // Restore the source appearance before any render or action; never leave an icon/card stuck.
      session.cardEl.classList.remove('dragging-pin', 'dragging-note', 'note-drag-source');
      document.body.classList.remove('note-drag-active');
      if (session.ghost) { session.ghost.remove(); session.ghost = null; }
      clearNoteDropTargets();
      try { if (session.handle.hasPointerCapture(e.pointerId)) session.handle.releasePointerCapture(e.pointerId); } catch (_) {}
      noteDragSession = null;
      setTimeout(() => { delete session.cardEl.dataset.justDragged; }, 420);

      if (cancelled) {
        if (shouldPersistPinnedOrder && !isProtectedLocked) await persistPinnedOrderFromVisibleDOM();
        else renderNoteList();
        if (!pointInsideActionFeature(dropX, dropY)) closeNoteActionWheel();
        return;
      }
      e.preventDefault();
      e.stopPropagation();

      if (isProtectedLocked) {
        renderNoteList();
        if (!pointInsideActionFeature(dropX, dropY)) closeNoteActionWheel();
        return;
      }

      if (pill) {
        const targetCategory = pill.dataset.category;
        if (targetCategory === 'STARRED') await performNoteAction(noteId, 'star-on');
        else if (['TEXT', 'SEED', 'IMAGE', 'FILE', 'TABLE'].includes(targetCategory)) await performNoteAction(noteId, `category:${targetCategory}`);
        else renderNoteList();
        if (!pointInsideActionFeature(dropX, dropY)) closeNoteActionWheel();
        return;
      }

      if (actionItem) {
        const action = actionItem.dataset.action;
        actionWheelSuppressUntilLeave = true;
        closeNoteActionWheel();
        await performNoteAction(noteId, action);
        return;
      }

      if (droppedOnDot) {
        openNoteActionWheel(noteId);
        return;
      }

      if (shouldPersistPinnedOrder) await persistPinnedOrderFromVisibleDOM();
      else renderNoteList();
      if (!pointInsideActionFeature(dropX, dropY)) closeNoteActionWheel();
      if (noteAutoSaveTimer) scheduleNoteAutoSave();
    }

    document.addEventListener('pointerup', e => { void finishNotePointer(e, false); }, { passive: false });
    document.addEventListener('pointercancel', e => { void finishNotePointer(e, true); }, { passive: false });

    async function persistPinnedOrderFromVisibleDOM() {
      const list = document.getElementById('note-list');
      const visibleOrder = Array.from(list.querySelectorAll('.note-card[data-pinned="1"]')).map(el => el.dataset.id);
      if (!visibleOrder.length) { renderNoteList(); return; }

      // Flush current editor text before persisting ordering, without losing the DOM order captured above.
      if (currentNoteId && document.getElementById('editor-content').style.display === 'flex') await saveCurrentNote();

      const visibleIds = new Set(visibleOrder);
      const allPinned = decryptedNotes.filter(n => n.pinned).sort((a, b) => {
        const ao = typeof a.pinOrder === 'number' ? a.pinOrder : Number.MAX_SAFE_INTEGER;
        const bo = typeof b.pinOrder === 'number' ? b.pinOrder : Number.MAX_SAFE_INTEGER;
        return ao !== bo ? ao - bo : (b.updatedAt || 0) - (a.updatedAt || 0);
      });
      // Locked notes and filtered-out notes keep their slots. Reorder only the visible,
      // unlocked pins, and move them into the existing slots' pinOrder values.
      const visibleUnlockedOrder = visibleOrder.filter(id => {
        const note = decryptedNotes.find(item => item.id === id);
        return Boolean(note && !isNoteLocked(note));
      });
      const slotOrders = allPinned.map((note, index) =>
        typeof note.pinOrder === 'number' ? note.pinOrder : index + 1
      );
      let visibleIndex = 0;
      const finalOrder = allPinned.map(note => {
        if (isNoteLocked(note) || !visibleIds.has(note.id)) return note.id;
        return visibleUnlockedOrder[visibleIndex++] || note.id;
      });
      await enqueueNoteSave(async () => {
        for (let i = 0; i < finalOrder.length; i++) {
          const note = decryptedNotes.find(n => n.id === finalOrder[i]);
          if (!note || isNoteLocked(note) || !visibleIds.has(note.id)) continue;
          const nextPinOrder = slotOrders[i];
          if (note.pinOrder === nextPinOrder) continue;
          note.pinOrder = nextPinOrder;
          const encrypted = await encryptObject(note, masterCryptoKey);
          if (!decryptedNotes.some(n => n.id === note.id)) continue;
          await dbPut('notes', { id: note.id, updatedAt: note.updatedAt || Date.now(), iv: encrypted.iv, data: encrypted.data });
        }
        sortNotesArray();
        renderNoteList();
      });
    }

    // Up/down arrows navigate visible notes. Keep ordinary text editing untouched,
    // but explicitly restore focus to the replacement card after renderNoteList().
    document.addEventListener('keydown', async e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      const active = document.activeElement;
      const tag = active && active.tagName ? active.tagName.toUpperCase() : '';
      const id = active ? active.id : '';
      if (tag === 'TEXTAREA' || tag === 'SELECT' || active?.isContentEditable || active?.matches?.('input.sheet-cell')) return;
      if (tag === 'INPUT' && !['note-lock-pass'].includes(id)) return;
      if (!masterCryptoKey || document.getElementById('app-container').style.display === 'none') return;

      const cards = Array.from(document.querySelectorAll('#note-list .note-card'));
      if (!cards.length) return;
      const activeIndex = cards.findIndex(card => card.dataset.id === currentNoteId || card.classList.contains('active'));
      const step = e.key === 'ArrowDown' ? 1 : -1;
      let candidateIndex = activeIndex === -1 ? (step > 0 ? 0 : cards.length - 1) : activeIndex + step;
      while (candidateIndex >= 0 && candidateIndex < cards.length) {
        const target = decryptedNotes.find(n => n.id === cards[candidateIndex].dataset.id);
        if (!target) { candidateIndex += step; continue; }
        if (!isNoteLocked(target)) break;
        candidateIndex += step;
      }
      if (candidateIndex < 0 || candidateIndex >= cards.length) return;
      e.preventDefault();
      const targetId = cards[candidateIndex].dataset.id;
      cards[candidateIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      await selectNote(targetId);
      const refreshed = document.querySelector(`#note-list .note-card[data-id="${CSS.escape(targetId)}"]`);
      if (refreshed) refreshed.focus({ preventScroll: true });
    });

    function setCategoryFilter(cat, el) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderNoteList();
    }

    function createNewNote(category = 'TEXT') {
      const minPinOrder = decryptedNotes.reduce((min, n) => (n.pinned && typeof n.pinOrder === 'number' ? Math.min(min, n.pinOrder) : min), 1);
      const newNote = {
        id: 'note_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        title: '',
        category: category === 'TABLE' ? 'TABLE' : 'TEXT',
        pinned: false,
        pinOrder: minPinOrder - 1,
        starred: currentCategoryFilter === 'STARRED',
        secret: '',
        body: '',
        attachments: [],
        ...(category === 'TABLE' ? { tableData: createDefaultTableData() } : {}),
        updatedAt: Date.now()
      };
      decryptedNotes.unshift(newNote);
      unlockedSessionNoteId = newNote.id;
      void selectNote(newNote.id).then(() => {
        if (currentNoteId === newNote.id) document.getElementById('note-title').focus();
      }).catch(err => console.error('Could not open new note:', err));
    }

    function createNewTableNote() { createNewNote('TABLE'); }

    function updateActionIconsState(note) {
      const pinBtn = document.getElementById('pin-btn');
      const starBtn = document.getElementById('star-btn');
      if (pinBtn) pinBtn.style.color = note.pinned ? 'var(--accent)' : 'var(--text-muted)';
      if (starBtn) starBtn.style.color = note.starred ? '#ffd60a' : 'var(--text-muted)';
    }

    let sheetSelection = null;
    let sheetPointerSelection = null;

    function normalizeHexColor(value) {
      const raw = String(value || '').trim();
      if (/^#[0-9a-f]{3}$/i.test(raw)) return '#' + raw.slice(1).split('').map(char => char + char).join('').toUpperCase();
      if (/^#[0-9a-f]{6}$/i.test(raw)) return raw.toUpperCase();
      return null;
    }

    function createDefaultTableData(rows = 3, columns = 3) {
      return {
        rows: Array.from({ length: rows }, () => Array.from({ length: columns }, () => '')),
        cornerHeader: '#',
        columnHeaders: Array.from({ length: columns }, (_, index) => spreadsheetColumnName(index)),
        rowHeaders: Array.from({ length: rows }, (_, index) => String(index + 1)),
        cellColors: {}
      };
    }

    function normalizeTableData(data) {
      const fallback = createDefaultTableData();
      const sourceRows = data && Array.isArray(data.rows) ? data.rows : fallback.rows;
      const rows = sourceRows.slice(0, 100).map(row => Array.isArray(row) ? row.slice(0, 30).map(cell => cell == null ? '' : String(cell)) : ['']);
      if (!rows.length) rows.push(['']);
      const columns = Math.max(1, Math.min(30, Math.max(...rows.map(row => row.length))));
      const normalizedRows = rows.map(row => Array.from({ length: columns }, (_, i) => row[i] == null ? '' : String(row[i])));
      const sourceColumnHeaders = data && Array.isArray(data.columnHeaders) ? data.columnHeaders : [];
      const sourceRowHeaders = data && Array.isArray(data.rowHeaders) ? data.rowHeaders : [];
      const columnHeaders = Array.from({ length: columns }, (_, index) => sourceColumnHeaders[index] == null ? spreadsheetColumnName(index) : String(sourceColumnHeaders[index]).slice(0, 60));
      const rowHeaders = Array.from({ length: normalizedRows.length }, (_, index) => sourceRowHeaders[index] == null ? String(index + 1) : String(sourceRowHeaders[index]).slice(0, 60));
      const cellColors = {};
      const sourceColors = data && data.cellColors && typeof data.cellColors === 'object' ? data.cellColors : {};
      for (const [key, value] of Object.entries(sourceColors)) {
        const match = /^(\d+):(\d+)$/.exec(key);
        const color = normalizeHexColor(value);
        if (!match || !color) continue;
        const row = Number(match[1]), column = Number(match[2]);
        if (row >= 0 && row < normalizedRows.length && column >= 0 && column < columns) cellColors[`${row}:${column}`] = color;
      }
      return {
        rows: normalizedRows,
        cornerHeader: data && data.cornerHeader != null ? String(data.cornerHeader).slice(0, 60) : '#',
        columnHeaders,
        rowHeaders,
        cellColors
      };
    }

    // The note model is the source of truth. Never reconstruct saved data from DOM,
    // because lock/close flows intentionally clear the rendered grid for privacy.
    function getCurrentTableData() {
      const note = decryptedNotes.find(item => item.id === currentNoteId);
      return normalizeTableData(note?.tableData || createDefaultTableData());
    }

    // Update only the changed field in the in-memory model; do not scrape the whole grid.
    function updateTableDataFromInput(target) {
      const note = decryptedNotes.find(item => item.id === currentNoteId);
      if (!note || note.category !== 'TABLE' || !target) return;
      const data = normalizeTableData(note.tableData || createDefaultTableData());

      if (target.matches('input.sheet-cell')) {
        const row = Number(target.dataset.row);
        const column = Number(target.dataset.column);
        if (!Number.isInteger(row) || !Number.isInteger(column) ||
            row < 0 || row >= data.rows.length || column < 0 || column >= data.rows[row].length) return;
        data.rows[row][column] = target.value;
      } else if (target.matches('input.sheet-header-input')) {
        if (target.hasAttribute('data-corner-header')) {
          data.cornerHeader = target.value;
        } else if (target.hasAttribute('data-column-header')) {
          const column = Number(target.dataset.columnHeader);
          if (!Number.isInteger(column) || column < 0 || column >= data.columnHeaders.length) return;
          data.columnHeaders[column] = target.value;
        } else if (target.hasAttribute('data-row-header')) {
          const row = Number(target.dataset.rowHeader);
          if (!Number.isInteger(row) || row < 0 || row >= data.rowHeaders.length) return;
          data.rowHeaders[row] = target.value;
        } else {
          return;
        }
      } else {
        return;
      }

      note.tableData = normalizeTableData(data);
    }

    function spreadsheetColumnName(index) {
      let value = index + 1, label = '';
      while (value > 0) { const remainder = (value - 1) % 26; label = String.fromCharCode(65 + remainder) + label; value = Math.floor((value - 1) / 26); }
      return label;
    }

    function renderTableEditor(data) {
      const grid = document.getElementById('note-table-grid');
      if (!grid) return;
      const normalized = normalizeTableData(data);
      const columns = normalized.rows[0].length;
      const thead = `<thead><tr><th scope="col"><input class="sheet-header-input" type="text" data-corner-header value="${escapeHtml(normalized.cornerHeader)}" aria-label="Corner header title" maxlength="60" /></th>${Array.from({ length: columns }, (_, col) => `<th scope="col"><div class="sheet-head-content"><input class="sheet-header-input" type="text" data-column-header="${col}" value="${escapeHtml(normalized.columnHeaders[col])}" aria-label="Column ${col + 1} title" maxlength="60" /><button type="button" class="sheet-remove" data-remove-column="${col}" aria-label="Remove column ${escapeHtml(normalized.columnHeaders[col] || col + 1)}" title="Remove column">×</button></div></th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${normalized.rows.map((row, rowIndex) => `<tr><th scope="row"><div class="sheet-head-content"><input class="sheet-header-input" type="text" data-row-header="${rowIndex}" value="${escapeHtml(normalized.rowHeaders[rowIndex])}" aria-label="Row ${rowIndex + 1} title" maxlength="60" /><button type="button" class="sheet-remove" data-remove-row="${rowIndex}" aria-label="Remove row ${rowIndex + 1}" title="Remove row">×</button></div></th>${row.map((value, colIndex) => { const color = normalized.cellColors[`${rowIndex}:${colIndex}`] || ''; return `<td><input class="sheet-cell${isCellInSheetSelection(rowIndex, colIndex) ? ' selected' : ''}" type="text" data-row="${rowIndex}" data-column="${colIndex}"${color ? ` data-cell-color="${color}" style="background-color:${color}"` : ''} aria-label="${escapeHtml(normalized.columnHeaders[colIndex])} ${escapeHtml(normalized.rowHeaders[rowIndex])}" value="${escapeHtml(value)}" autocomplete="off" spellcheck="false" /></td>`; }).join('')}</tr>`).join('')}</tbody>`;
      grid.innerHTML = thead + tbody;
      applySheetSelectionStyles();
    }

    function setEditorModeForNote(note) {
      const isTable = Boolean(note && note.category === 'TABLE');
      const tableWrap = document.getElementById('note-table-wrap');
      const secretBox = document.querySelector('.secret-box');
      const body = document.getElementById('note-body');
      const attachments = document.getElementById('attachments-bar');
      if (tableWrap) tableWrap.style.display = isTable ? 'flex' : 'none';
      if (secretBox) secretBox.style.display = 'flex';
      if (body) body.style.display = isTable ? 'none' : 'block';
      if (attachments) attachments.style.display = 'flex';
      if (isTable) renderTableEditor(note.tableData);
      syncTitleLabelPosition();
    }

    function syncTitleLabelPosition() {
      const input = document.getElementById('note-title');
      const group = document.querySelector('.title-group');
      if (!input || !group) return;
      const style = getComputedStyle(input);
      const canvas = syncTitleLabelPosition.canvas || (syncTitleLabelPosition.canvas = document.createElement('canvas'));
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const textWidth = ctx.measureText(input.value || input.placeholder || 'Untitled').width + 18;
      const label = document.getElementById('note-category-label');
      const icon = document.getElementById('editor-type-icon');
      const reserved = (icon?.offsetWidth || 16) + 12 + (label?.offsetWidth || 74) + 14;
      const maxTitleWidth = Math.max(48, Math.min(320, group.clientWidth - reserved, group.clientWidth * 0.52));
      input.style.width = `${Math.max(48, Math.min(maxTitleWidth, textWidth))}px`;
    }

    function remapCellColorsAfterRemoval(cellColors, axis, removedIndex) {
      const remapped = {};
      for (const [key, color] of Object.entries(cellColors || {})) {
        const [row, column] = key.split(':').map(Number);
        const index = axis === 'row' ? row : column;
        if (index === removedIndex) continue;
        const nextRow = axis === 'row' && row > removedIndex ? row - 1 : row;
        const nextColumn = axis === 'column' && column > removedIndex ? column - 1 : column;
        remapped[`${nextRow}:${nextColumn}`] = color;
      }
      return remapped;
    }

    function handleTableGridClick(event) {
      const removeRow = event.target.closest('[data-remove-row]');
      const removeColumn = event.target.closest('[data-remove-column]');
      const actionButton = event.target.closest('[data-sheet-action]');
      if (!removeRow && !removeColumn && !actionButton) return;
      if (actionButton && actionButton.dataset.sheetAction === 'color') {
        const rect = actionButton.getBoundingClientRect();
        openSheetColorMenu(rect.left, rect.bottom + 6);
        return;
      }
      const data = getCurrentTableData();
      if (removeRow) {
        if (data.rows.length <= 1) return;
        const index = Number(removeRow.dataset.removeRow);
        data.rows.splice(index, 1);
        data.rowHeaders.splice(index, 1);
        data.cellColors = remapCellColorsAfterRemoval(data.cellColors, 'row', index);
        sheetSelection = null;
      } else if (removeColumn) {
        if (data.rows[0].length <= 1) return;
        const column = Number(removeColumn.dataset.removeColumn);
        data.rows = data.rows.map(row => row.filter((_, index) => index !== column));
        data.columnHeaders.splice(column, 1);
        data.cellColors = remapCellColorsAfterRemoval(data.cellColors, 'column', column);
        sheetSelection = null;
      } else if (actionButton.dataset.sheetAction === 'add-row') {
        if (data.rows.length >= 100) return;
        data.rows.push(Array.from({ length: data.rows[0].length }, () => ''));
        data.rowHeaders.push(String(data.rowHeaders.length + 1));
      } else if (actionButton.dataset.sheetAction === 'add-column') {
        if (data.rows[0].length >= 30) return;
        data.rows = data.rows.map(row => [...row, '']);
        data.columnHeaders.push(spreadsheetColumnName(data.columnHeaders.length));
      } else if (actionButton.dataset.sheetAction === 'copy') {
        void copyCurrentTableTSV();
        return;
      } else {
        return;
      }
      const note = decryptedNotes.find(item => item.id === currentNoteId);
      if (note) note.tableData = normalizeTableData(data);
      renderTableEditor(data);
      scheduleNoteAutoSave();
    }

    function showSaveStatus(message, color = 'var(--success)') {
      const status = document.getElementById('save-status');
      if (!status) return;
      status.style.color = color;
      status.textContent = message;
      setTimeout(() => { if (status.textContent === message) status.textContent = ''; }, 1800);
    }

    function fallbackCopyText(text) {
      const temp = document.createElement('textarea');
      temp.value = text; temp.style.position = 'fixed'; temp.style.opacity = '0';
      document.body.appendChild(temp); temp.select();
      try { document.execCommand('copy'); showSaveStatus('.', 'var(--success)'); }
      catch (_) { showSaveStatus('Copy unavailable', 'var(--danger)'); }
      temp.remove();
    }

    function copyCurrentTableTSV() {
      const data = getCurrentTableData();
      const tsv = data.rows.map(row => row.map(value => String(value).replace(/\t/g, ' ').replace(/\r?\n/g, ' ')).join('\t')).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tsv).then(() => showSaveStatus('.', 'var(--success)')).catch(() => fallbackCopyText(tsv));
      } else fallbackCopyText(tsv);
    }

    function readCellCoordinates(element) {
      const cell = element && element.closest ? element.closest('input.sheet-cell') : null;
      if (!cell) return null;
      return { row: Number(cell.dataset.row), column: Number(cell.dataset.column) };
    }

    function getSheetSelectionBounds() {
      if (!sheetSelection) return null;
      return {
        top: Math.min(sheetSelection.anchor.row, sheetSelection.focus.row),
        bottom: Math.max(sheetSelection.anchor.row, sheetSelection.focus.row),
        left: Math.min(sheetSelection.anchor.column, sheetSelection.focus.column),
        right: Math.max(sheetSelection.anchor.column, sheetSelection.focus.column)
      };
    }

    function isCellInSheetSelection(row, column) {
      const bounds = getSheetSelectionBounds();
      return Boolean(bounds && row >= bounds.top && row <= bounds.bottom && column >= bounds.left && column <= bounds.right);
    }

    function applySheetSelectionStyles() {
      const grid = document.getElementById('note-table-grid');
      if (!grid) return;
      grid.querySelectorAll('input.sheet-cell').forEach(cell => {
        const selected = isCellInSheetSelection(Number(cell.dataset.row), Number(cell.dataset.column));
        cell.classList.toggle('selected', selected);
        cell.setAttribute('aria-selected', selected ? 'true' : 'false');
      });
    }

    function openSheetColorMenu(x, y) {
      const menu = document.getElementById('sheet-context-menu');
      const hex = document.getElementById('sheet-color-hex');
      const picker = document.getElementById('sheet-color-picker');
      if (!menu || !hex || !picker) return;
      if (!sheetSelection) sheetSelection = { anchor: { row: 0, column: 0 }, focus: { row: 0, column: 0 } };
      applySheetSelectionStyles();
      const menuWidth = Math.min(270, window.innerWidth - 16);
      menu.style.left = `${Math.max(8, Math.min(x, window.innerWidth - menuWidth - 8))}px`;
      menu.style.top = `${Math.max(8, Math.min(y, window.innerHeight - menu.offsetHeight - 8))}px`;
      menu.classList.add('show');
      menu.setAttribute('aria-hidden', 'false');
      const current = normalizeHexColor(hex.value) || '#0A84FF';
      picker.value = current.toLowerCase();
      requestAnimationFrame(() => { menu.style.top = `${Math.max(8, Math.min(y, window.innerHeight - menu.offsetHeight - 8))}px`; hex.focus(); hex.select(); });
    }

    function closeSheetColorMenu() {
      const menu = document.getElementById('sheet-context-menu');
      if (!menu) return;
      menu.classList.remove('show');
      menu.setAttribute('aria-hidden', 'true');
    }

    function applySheetCellColor(colorValue) {
      const color = colorValue === null ? null : normalizeHexColor(colorValue);
      if (colorValue !== null && !color) {
        showSaveStatus('Use a HEX color such as #0A84FF', 'var(--danger)');
        document.getElementById('sheet-color-hex')?.focus();
        return;
      }
      const data = getCurrentTableData();
      const bounds = getSheetSelectionBounds() || { top: 0, bottom: 0, left: 0, right: 0 };
      for (let row = bounds.top; row <= bounds.bottom; row++) {
        for (let column = bounds.left; column <= bounds.right; column++) {
          if (!data.rows[row] || column >= data.rows[row].length) continue;
          const key = `${row}:${column}`;
          if (color) data.cellColors[key] = color;
          else delete data.cellColors[key];
        }
      }
      const note = decryptedNotes.find(item => item.id === currentNoteId);
      if (note) note.tableData = normalizeTableData(data);
      renderTableEditor(data);
      scheduleNoteAutoSave();
      closeSheetColorMenu();
    }

    const tableGrid = document.getElementById('note-table-grid');
    if (tableGrid) {
      tableGrid.addEventListener('input', event => {
        if (!event.target.matches('input.sheet-cell, input.sheet-header-input')) return;
        updateTableDataFromInput(event.target);
        scheduleNoteAutoSave();
      });
      tableGrid.addEventListener('pointerdown', event => {
        const coords = readCellCoordinates(event.target);
        if (!coords || event.button !== 0) return;
        if (event.shiftKey && sheetSelection) {
          sheetSelection.focus = coords;
          applySheetSelectionStyles();
        } else {
          sheetSelection = { anchor: coords, focus: coords };
          applySheetSelectionStyles();
        }
        // Native touch scrolling is retained on phones; mouse/pen dragging selects a range.
        if (event.pointerType === 'touch') return;
        sheetPointerSelection = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, moved: false };
      });
      tableGrid.addEventListener('contextmenu', event => {
        const coords = readCellCoordinates(event.target);
        if (!coords) return;
        event.preventDefault();
        if (!isCellInSheetSelection(coords.row, coords.column)) sheetSelection = { anchor: coords, focus: coords };
        applySheetSelectionStyles();
        openSheetColorMenu(event.clientX, event.clientY);
      });
      tableGrid.addEventListener('click', handleTableGridClick);
      tableGrid.addEventListener('keydown', event => {
        if (!(event.metaKey || event.ctrlKey) || event.key.toLowerCase() !== 'c') return;
        const cell = event.target;
        if (!cell.matches || !cell.matches('input.sheet-cell')) return;
        // Keep normal text-copy behavior when the user selected only part of a cell.
        if (typeof cell.selectionStart === 'number' && cell.selectionStart !== cell.selectionEnd) return;
        event.preventDefault();
        copyCurrentTableTSV();
      });
    }

    document.addEventListener('pointermove', event => {
      const session = sheetPointerSelection;
      if (!session || event.pointerId !== session.pointerId) return;
      if (!session.moved && Math.hypot(event.clientX - session.startX, event.clientY - session.startY) < 6) return;
      session.moved = true;
      const coords = readCellCoordinates(document.elementFromPoint(event.clientX, event.clientY));
      if (!coords || !sheetSelection) return;
      const grid = document.getElementById('note-table-grid');
      if (grid) grid.classList.add('sheet-selecting');
      event.preventDefault();
      try { document.getSelection()?.removeAllRanges(); } catch (_) {}
      sheetSelection.focus = coords;
      applySheetSelectionStyles();
    }, { passive: false });

    document.addEventListener('pointerup', event => {
      if (!sheetPointerSelection || event.pointerId !== sheetPointerSelection.pointerId) return;
      const grid = document.getElementById('note-table-grid');
      if (grid) grid.classList.remove('sheet-selecting');
      sheetPointerSelection = null;
    });
    document.addEventListener('pointercancel', event => {
      if (!sheetPointerSelection || event.pointerId !== sheetPointerSelection.pointerId) return;
      const grid = document.getElementById('note-table-grid');
      if (grid) grid.classList.remove('sheet-selecting');
      sheetPointerSelection = null;
    });

    document.querySelectorAll('[data-sheet-action]').forEach(button => button.addEventListener('click', handleTableGridClick));
    document.getElementById('sheet-color-picker')?.addEventListener('input', event => {
      document.getElementById('sheet-color-hex').value = event.target.value.toUpperCase();
    });
    document.getElementById('sheet-color-hex')?.addEventListener('input', event => {
      const normalized = normalizeHexColor(event.target.value);
      if (normalized) document.getElementById('sheet-color-picker').value = normalized.toLowerCase();
    });
    document.getElementById('sheet-color-apply')?.addEventListener('click', () => applySheetCellColor(document.getElementById('sheet-color-hex').value));
    document.getElementById('sheet-color-clear')?.addEventListener('click', () => applySheetCellColor(null));
    document.getElementById('sheet-color-close')?.addEventListener('click', closeSheetColorMenu);
    document.addEventListener('click', event => {
      const menu = document.getElementById('sheet-context-menu');
      if (menu?.classList.contains('show') && !event.target.closest('#sheet-context-menu') && !event.target.closest('[data-sheet-action="color"]')) closeSheetColorMenu();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSheetColorMenu(); });
    document.getElementById('note-title')?.addEventListener('input', syncTitleLabelPosition);
    window.addEventListener('resize', syncTitleLabelPosition);

    async function selectNote(id) {
      const note = decryptedNotes.find(n => n.id === id);
      if (!note) return;
      if (currentNoteId !== id) {
        sheetSelection = null;
        sheetPointerSelection = null;
        closeSheetColorMenu();
      }

      if (currentNoteId && currentNoteId !== id && document.getElementById('editor-content').style.display === 'flex') {
        try {
          await saveCurrentNote();
        } catch (err) {
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'Save failed';
          }
          console.error('Could not auto-save note before switching:', err);
          return;
        }
      }
      if (currentNoteId !== id) {
        unlockedSessionNoteId = null;
      }
      currentNoteId = id;
      renderNoteList();

      const hasPassword = Boolean(note.secret && note.secret.trim());
      if (hasPassword && unlockedSessionNoteId !== id) {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('editor-content').style.display = 'none';
        const protectedTableGrid = document.getElementById('note-table-grid');
        if (protectedTableGrid) protectedTableGrid.innerHTML = '';
        const protectedTableWrap = document.getElementById('note-table-wrap');
        if (protectedTableWrap) protectedTableWrap.style.display = 'none';
        const workspace = document.querySelector('.workspace');
        if (workspace && window.matchMedia('(max-width: 700px)').matches) {
          workspace.classList.add('editing');
        }
        const lockView = document.getElementById('note-lock-view');
        const passInput = document.getElementById('note-lock-pass');
        lockView.style.display = 'flex';
        passInput.value = '';
        passInput.type = 'password';

        // Mỗi lần chọn một note có mật khẩu: thử Face ID / Touch ID tự động.
        // Hủy/thất bại/không có native bridge => rơi về đúng ô mật khẩu hiện tại.
        const biometricUnlocked = await requestNativeNoteBiometric();
        // Chặn kết quả sinh trắc cũ mở nhầm note nếu người dùng đã chuyển note
        // hoặc kho đã tự khóa trong lúc hộp thoại sinh trắc đang hiện.
        if (currentNoteId !== id || !masterCryptoKey) return;
        if (biometricUnlocked) {
          unlockedSessionNoteId = id;
          passInput.value = '';
          openNoteIntoEditor(note);
          return;
        }

        setTimeout(() => {
          if (currentNoteId === id && lockView.style.display === 'flex') passInput.focus();
        }, 30);
        return;
      }

      openNoteIntoEditor(note);
    }

    function checkNotePasswordLive() {
      const note = decryptedNotes.find(n => n.id === currentNoteId);
      if (!note) return;
      const val = document.getElementById('note-lock-pass').value;
      if (val === note.secret) {
        unlockedSessionNoteId = note.id;
        openNoteIntoEditor(note);
      }
    }

    function unlockProtectedNote(e) {
      e.preventDefault();
      const note = decryptedNotes.find(n => n.id === currentNoteId);
      if (!note) return;
      const val = document.getElementById('note-lock-pass').value;
      if (val === note.secret) {
        unlockedSessionNoteId = note.id;
        openNoteIntoEditor(note);
      } else {
        const lockView = document.getElementById('note-lock-view');
        lockView.classList.remove('shake');
        void lockView.offsetWidth;
        lockView.classList.add('shake');
      }
    }

    function openNoteIntoEditor(note) {
      const editor = document.getElementById('editor-content');
      if (editor) editor.inert = false;
      const workspace = document.querySelector('.workspace');
      if (workspace && window.matchMedia('(max-width: 700px)').matches) workspace.classList.add('editing');
      currentAttachments = JSON.parse(JSON.stringify(note.attachments || []));

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('note-lock-view').style.display = 'none';
      document.getElementById('editor-content').style.display = 'flex';

      const cat = note.category || 'TEXT';
      document.getElementById('note-title').value = note.title || '';
      updateEditorCategoryIcon(cat);

      document.getElementById('note-secret').value = note.secret || '';
      document.getElementById('note-secret').type = 'password';
      document.getElementById('note-body').value = note.body || '';
      setEditorModeForNote(note);

      updateActionIconsState(note);
      document.getElementById('save-status').textContent = '';
      renderAttachments();
    }

    async function closeMobileEditor() {
      const editor = document.getElementById('editor-content');
      const wasInert = Boolean(editor?.inert);
      if (currentNoteId && masterCryptoKey && editor?.style.display === 'flex') {
        if (editor) editor.inert = true;
        try {
          await saveCurrentNote();
        } catch (err) {
          if (editor) editor.inert = wasInert;
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'CLOSE CANCELLED — SAVE FAILED';
          }
          console.error('Could not save before closing the mobile editor:', err);
          alert('Chưa thể đóng Note vì lưu thất bại. Nội dung vẫn được giữ trong trình soạn thảo để bạn sao chép hoặc thử lưu lại.');
          return false;
        }
      }

      if (noteAutoSaveTimer) { clearTimeout(noteAutoSaveTimer); noteAutoSaveTimer = null; }
      currentNoteId = null;
      unlockedSessionNoteId = null;
      currentAttachments = [];
      closeNoteActionWheel();

      document.getElementById('note-title').value = '';
      document.getElementById('note-secret').value = '';
      document.getElementById('note-body').value = '';
      document.getElementById('note-lock-pass').value = '';
      document.getElementById('attachment-grid').innerHTML = '';
      const tableGrid = document.getElementById('note-table-grid');
      if (tableGrid) tableGrid.innerHTML = '';
      const tableWrap = document.getElementById('note-table-wrap');
      if (tableWrap) tableWrap.style.display = 'none';
      if (editor) {
        editor.style.display = 'none';
        editor.inert = false;
      }
      document.getElementById('note-lock-view').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';

      const ws = document.querySelector('.workspace');
      if (ws) ws.classList.remove('editing');
      renderNoteList();
      return true;
    }

    async function saveCurrentNote() {
      if (isVaultMaintenance) return;
      if (noteAutoSaveTimer) {
        clearTimeout(noteAutoSaveTimer);
        noteAutoSaveTimer = null;
      }
      if (!currentNoteId || !masterCryptoKey || document.getElementById('editor-content').style.display !== 'flex') return;
      const noteId = currentNoteId;
      const key = masterCryptoKey;
      const idx = decryptedNotes.findIndex(n => n.id === noteId);
      if (idx === -1) return;
      const snapshot = {
        title: document.getElementById('note-title').value.trim() || 'Untitled',
        secret: document.getElementById('note-secret').value,
        body: document.getElementById('note-body').value,
        attachments: JSON.parse(JSON.stringify(currentAttachments || [])),
        tableData: (decryptedNotes[idx].category === 'TABLE') ? normalizeTableData(decryptedNotes[idx].tableData || createDefaultTableData()) : (decryptedNotes[idx].tableData || null)
      };

      const persistSnapshot = async () => {
        const latestIndex = decryptedNotes.findIndex(n => n.id === noteId);
        if (latestIndex === -1) return;
        const updatedNote = {
          ...decryptedNotes[latestIndex],
          title: snapshot.title,
          category: decryptedNotes[latestIndex].category || 'TEXT',
          secret: snapshot.secret,
          body: snapshot.body,
          attachments: snapshot.attachments,
          ...(snapshot.tableData ? { tableData: normalizeTableData(snapshot.tableData) } : {}),
          updatedAt: Date.now()
        };
        const statusEl = document.getElementById('save-status');
        if (currentNoteId === noteId && statusEl) {
          statusEl.style.color = 'var(--success)';
          statusEl.textContent = '…';
        }

        const encrypted = await encryptObject(updatedNote, key);
        // Deletion may have happened while attachment data was being encrypted.
        if (!decryptedNotes.some(n => n.id === noteId)) return;
        // Commit to RAM before IndexedDB. If storage is full, this snapshot can still be
        // exported and the user does not lose the newest editor contents from memory.
        const finalIndex = decryptedNotes.findIndex(n => n.id === noteId);
        if (finalIndex !== -1) decryptedNotes[finalIndex] = updatedNote;
        await dbPut('notes', {
          id: updatedNote.id,
          updatedAt: updatedNote.updatedAt,
          iv: encrypted.iv,
          data: encrypted.data
        });

        if (currentNoteId === noteId) {
          unlockedSessionNoteId = updatedNote.id;
          updateEditorCategoryIcon(updatedNote.category);
          if (statusEl) {
            statusEl.style.color = 'var(--success)';
            statusEl.textContent = '.';
            setTimeout(() => { if (statusEl && statusEl.textContent === '.') statusEl.textContent = ''; }, 1800);
          }
        }
        sortNotesArray();
        renderNoteList();
      };

      // Serialize IndexedDB writes so a delayed encryption cannot overwrite a newer edit or delete.
      return enqueueNoteSave(persistSnapshot);
    }

    function scheduleNoteAutoSave() {
      if (noteAutoSaveTimer) clearTimeout(noteAutoSaveTimer);
      if (isVaultMaintenance || !currentNoteId || !masterCryptoKey || document.getElementById('editor-content').style.display !== 'flex') return;
      noteAutoSaveTimer = setTimeout(async () => {
        noteAutoSaveTimer = null;
        if (noteDragSession && noteDragSession.phase === 'dragging') {
          scheduleNoteAutoSave();
          return;
        }
        try { await saveCurrentNote(); }
        catch (err) {
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'Auto-save failed';
          }
          console.error('Auto-save failed:', err);
        }
      }, 450);
    }

    ['note-title', 'note-secret', 'note-body'].forEach(id => {
      const field = document.getElementById(id);
      if (field) field.addEventListener('input', scheduleNoteAutoSave);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && currentNoteId && masterCryptoKey && document.getElementById('editor-content').style.display === 'flex') {
        void saveCurrentNote().catch(err => console.error('Save on page hide failed:', err)); ////////////////////////////
      }
    });
    window.addEventListener('pagehide', () => {
      if (currentNoteId && masterCryptoKey && document.getElementById('editor-content').style.display === 'flex') void saveCurrentNote().catch(err => console.error('Save on page hide failed:', err));
    });

    async function togglePinCurrentNote() {
      if (!currentNoteId) return;
      const note = decryptedNotes.find(n => n.id === currentNoteId);
      if (!note) return;
      note.pinned = !note.pinned;
      if (note.pinned) {
        const minOrder = decryptedNotes.reduce((min, n) => (n.pinned && typeof n.pinOrder === 'number' ? Math.min(min, n.pinOrder) : min), 1);
        note.pinOrder = minOrder - 1;
      }
      updateActionIconsState(note);
      await saveCurrentNote();
    }

    async function toggleStarCurrentNote() {
      if (!currentNoteId) return;
      const note = decryptedNotes.find(n => n.id === currentNoteId);
      if (!note) return;
      note.starred = !note.starred;
      updateActionIconsState(note);
      await saveCurrentNote();
    }

    async function deleteCurrentNote() {
      if (!currentNoteId) return;
      await deleteNoteById(currentNoteId, true);
    }

    const NOTE_ACTIONS = [ /////////////
      { action: 'save', title: 'Save note', label: 'Save', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>' },
      { action: 'star', title: 'Star', label: 'Star', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>' },
      { action: 'pin', title: 'Pin / Unpin', label: 'Pin', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>' },
      { action: 'category:TEXT', title: 'Set type: Text', label: 'Text', icon: CATEGORY_ICONS.TEXT },
      { action: 'category:SEED', title: 'Set type: Credentials', label: 'Credentials', icon: CATEGORY_ICONS.SEED },
      { action: 'category:IMAGE', title: 'Set type: Image', label: 'Image', icon: CATEGORY_ICONS.IMAGE },
      { action: 'category:FILE', title: 'Set type: File', label: 'File', icon: CATEGORY_ICONS.FILE },
      { action: 'category:TABLE', title: 'Set type: Spreadsheet', label: 'Spreadsheet', icon: CATEGORY_ICONS.TABLE },
      { action: 'delete', title: 'Delete note', label: 'Delete', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' }
    ];
    let actionWheelNoteId = null;
    let actionWheelCenter = null;
    let actionWheelRadius = 0;
    let actionWheelSuppressUntilLeave = false;

    function openNoteActionWheel(noteId) {
      const targetNote = decryptedNotes.find(n => n.id === noteId);
      if (!noteId || !targetNote) return;
      if (isNoteLocked(targetNote)) {
        closeNoteActionWheel();
        return;
      }
      actionWheelSuppressUntilLeave = false;
      actionWheelNoteId = noteId;
      const wheel = document.getElementById('note-action-wheel');
      const dot = document.getElementById('note-action-dot');
      if (!wheel || !dot) return;
      wheel.innerHTML = '';
      const rect = dot.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const radius = Math.min(70, Math.max(56, Math.min(window.innerWidth, window.innerHeight) * 0.17));
      const orbitCenterX = Math.max(radius + 26, Math.min(window.innerWidth - radius - 26, cx - radius - 24));
      const orbitCenterY = Math.max(radius + 26, Math.min(window.innerHeight - radius - 26, cy - radius - 24));
      actionWheelCenter = { x: orbitCenterX, y: orbitCenterY };
      actionWheelRadius = radius;
      NOTE_ACTIONS.forEach((item, index) => {
        const angle = (-90 + index * (360 / NOTE_ACTIONS.length)) * Math.PI / 180;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'note-action-item';
        button.dataset.action = item.action;
        button.title = item.title;
        button.setAttribute('aria-label', item.title);
        button.innerHTML = item.icon;
        button.style.left = `${orbitCenterX + Math.cos(angle) * radius}px`;
        button.style.top = `${orbitCenterY + Math.sin(angle) * radius}px`;
        button.addEventListener('click', async e => {
          e.preventDefault();
          e.stopPropagation();
          const targetId = actionWheelNoteId;
          const action = button.dataset.action;
          actionWheelSuppressUntilLeave = true;
          closeNoteActionWheel();
          await performNoteAction(targetId, action);
        });
        wheel.appendChild(button);
      });
      wheel.classList.add('show');
      wheel.setAttribute('aria-hidden', 'false');
      dot.classList.add('open');
    }

    function closeNoteActionWheel() {
      const wheel = document.getElementById('note-action-wheel');
      const dot = document.getElementById('note-action-dot');
      if (wheel) {
        wheel.classList.remove('show');
        wheel.setAttribute('aria-hidden', 'true');
        wheel.innerHTML = '';
      }
      if (dot) dot.classList.remove('open', 'drag-over');
      actionWheelNoteId = null;
    }

    async function persistNoteById(note) {
      if (!note || !masterCryptoKey || isNoteLocked(note) || !decryptedNotes.some(n => n.id === note.id)) return;
      if (note.id === currentNoteId && document.getElementById('editor-content').style.display === 'flex') {
        await saveCurrentNote();
        return;
      }
      // Serialize non-editor actions with autosave and deletion; never write a removed note.
      return enqueueNoteSave(async () => {
        const latestNote = decryptedNotes.find(n => n.id === note.id);
        if (!latestNote || !masterCryptoKey) return;
        const key = masterCryptoKey;
        latestNote.updatedAt = Date.now();
        const encrypted = await encryptObject(latestNote, key);
        if (!decryptedNotes.some(n => n.id === latestNote.id)) return;
        await dbPut('notes', { id: latestNote.id, updatedAt: latestNote.updatedAt, iv: encrypted.iv, data: encrypted.data });
        sortNotesArray();
        renderNoteList();
      });
    }

    async function performNoteAction(noteId, action) {
      const note = decryptedNotes.find(n => n.id === noteId);
      if (!note || isNoteLocked(note)) return;
      if (action === 'save') {
        if (noteId === currentNoteId && document.getElementById('editor-content').style.display === 'flex') {
          await saveCurrentNote();
        } else {
          await persistNoteById(note);
        }
        return;
      }
      if (action === 'delete') {
        await deleteNoteById(noteId, true);
        return;
      }
      if (action === 'star') note.starred = !note.starred;
      else if (action === 'star-on') note.starred = true;
      else if (action === 'pin') {
        note.pinned = !note.pinned;
        if (note.pinned) {
          const minOrder = decryptedNotes.reduce((min, n) => n.pinned && typeof n.pinOrder === 'number' ? Math.min(min, n.pinOrder) : min, 1);
          note.pinOrder = minOrder - 1;
        }
      } else if (action.startsWith('category:')) {
        const nextCategory = action.split(':')[1];
        if (!['TEXT', 'SEED', 'IMAGE', 'FILE', 'TABLE'].includes(nextCategory)) return;
        // A note has exactly one document category: replace rather than accumulate.
        note.category = nextCategory;
        if (nextCategory === 'TABLE') note.tableData = normalizeTableData(note.tableData);
        if (note.id === currentNoteId) {
          updateEditorCategoryIcon(nextCategory);
          setEditorModeForNote(note);
        }
      } else {
        return;
      }
      updateActionIconsState(note);
      await persistNoteById(note);
      if (currentNoteId === note.id) updateActionIconsState(note);
    }

    async function deleteNoteById(noteId, askConfirm = true) {
      if (!noteId) return false;
      const note = decryptedNotes.find(n => n.id === noteId);
      if (!note || isNoteLocked(note)) return false;
      if (askConfirm && !confirm('Delete this item permanently?')) return false; ///////////////////////

      // The editor's pending timer belongs to currentNoteId. Cancel it only when deleting
      // that note, so deleting a different card cannot discard the active editor's draft.
      const wasCurrent = currentNoteId === noteId;
      const previousUnlockedSessionNoteId = unlockedSessionNoteId;
      if (wasCurrent) {
        if (noteAutoSaveTimer) { clearTimeout(noteAutoSaveTimer); noteAutoSaveTimer = null; }
        currentNoteId = null;
        unlockedSessionNoteId = null;
      }
      decryptedNotes = decryptedNotes.filter(n => n.id !== noteId);
      closeNoteActionWheel();

      try {
        await enqueueNoteSave(() => atomicDeleteNoteAndAttachments(note));
      } catch (err) {
        if (!decryptedNotes.some(n => n.id === noteId)) decryptedNotes.push(note);
        sortNotesArray();
        if (wasCurrent) {
          currentNoteId = noteId;
          unlockedSessionNoteId = previousUnlockedSessionNoteId;
          if (document.getElementById('editor-content').style.display === 'flex') scheduleNoteAutoSave();
        }
        renderNoteList();
        const statusEl = document.getElementById('save-status');
        if (statusEl) {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = 'DELETE FAILED'; ///////////////////////
        }
        console.error('Could not delete note:', err);
        alert('Xóa Note thất bại. Note đã được khôi phục trong danh sách; hãy thử lại sau khi kiểm tra dung lượng lưu trữ.'); ////////////////////
        return false;
      }

      if (wasCurrent && currentNoteId === null) await closeMobileEditor();
      renderNoteList();
      return true;
    }

    const noteActionDot = document.getElementById('note-action-dot');
    if (noteActionDot) {
      noteActionDot.addEventListener('pointerenter', e => {
        if (e.pointerType === 'touch' || (noteDragSession && noteDragSession.phase === 'dragging')) return;
        if (currentNoteId && !document.getElementById('note-action-wheel').classList.contains('show') && !actionWheelSuppressUntilLeave) openNoteActionWheel(currentNoteId);
      });
      noteActionDot.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const targetId = actionWheelNoteId || currentNoteId;
        if (!targetId) return;
        // Mouse users reveal the wheel by hovering; tapping still opens it on touch devices.
        if (!document.getElementById('note-action-wheel').classList.contains('show')) openNoteActionWheel(targetId);
      });
    }
    document.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (noteDragSession && noteDragSession.phase === 'dragging') return;
      const wheel = document.getElementById('note-action-wheel');
      const nearDot = pointNearActionDot(e.clientX, e.clientY);
      const inWheelZone = pointInsideActionWheelZone(e.clientX, e.clientY);
      if (!nearDot && !inWheelZone) {
        actionWheelSuppressUntilLeave = false;
        if (wheel.classList.contains('show')) closeNoteActionWheel();
        return;
      }
      if (actionWheelSuppressUntilLeave) return;
      // Once a dragged note opens the wheel, keep that target until the pointer leaves.
      if (!wheel.classList.contains('show')) {
        const targetId = currentNoteId || actionWheelNoteId;
        if (targetId) openNoteActionWheel(targetId);
      }
    });
    document.addEventListener('pointerout', e => {
      if (e.pointerType === 'touch') return;
      if (!e.relatedTarget && !(noteDragSession && noteDragSession.phase === 'dragging')) closeNoteActionWheel();
    });
    document.addEventListener('click', e => {
      if (e.target.closest('#note-action-dot, #note-action-wheel')) return;
      if (document.getElementById('note-action-wheel')?.classList.contains('show')) closeNoteActionWheel();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        actionWheelSuppressUntilLeave = true;
        closeNoteActionWheel();
      }
    });
    window.addEventListener('resize', () => {
      if (document.getElementById('note-action-wheel')?.classList.contains('show') && actionWheelNoteId) openNoteActionWheel(actionWheelNoteId);
      else { actionWheelCenter = null; actionWheelRadius = 0; }
    });

    function toggleSecretMask() {
      const input = document.getElementById('note-secret');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function copySecretField() {
      const val = document.getElementById('note-secret').value;
      if (!val) return;
      await navigator.clipboard.writeText(val);
      const statusEl = document.getElementById('save-status');
      statusEl.style.color = 'var(--success)';
      statusEl.textContent = 'Copied';
      if (clipboardClearTimer) clearTimeout(clipboardClearTimer);
      clipboardClearTimer = setTimeout(async () => {
        clipboardClearTimer = null;
        try { await navigator.clipboard.writeText(''); } catch (e) {
          // Some browsers require a fresh user gesture for clipboard writes in a timer.
        }
      }, 20000);
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2000);
    }

    /********************************************************************
     * 5. PHASE 4: DRAG & DROP + XỬ LÝ TỆP ĐÍNH KÈM AN TOÀN DUNG LƯỢNG
     ********************************************************************/
    const MAX_SINGLE_FILE_BYTES = 15 * 1024 * 1024; ////////////////////////////////////////////////
    const MAX_NOTE_TOTAL_BYTES = 50 * 1024 * 1024;  // 50 MB / note

    async function handleFilesSelected(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = '';
      await processAttachmentFiles(files);
    }

    async function processAttachmentFiles(files) {
      if (!files.length || !currentNoteId || !masterCryptoKey) return;
      const statusEl = document.getElementById('save-status');
      const originalAttachments = currentAttachments.slice();
      let currentTotalBytes = currentAttachments.reduce((sum, a) => sum + (a.size || 0), 0);
      let addedCount = 0;
      let skippedDuplicate = 0;
      let skippedTooLarge = 0;
      const addedIds = [];

      try {
        for (const file of files) {
          const isDuplicate = currentAttachments.some(a => a.name === file.name && a.size === file.size);
          if (isDuplicate) {
            skippedDuplicate++;
            continue;
          }
          if (file.size > MAX_SINGLE_FILE_BYTES || (currentTotalBytes + file.size) > MAX_NOTE_TOTAL_BYTES) {
            skippedTooLarge++;
            continue;
          }

          statusEl.style.color = '#ffd60a';
          statusEl.textContent = `Loading ${file.name}...`;
          await new Promise(r => setTimeout(r, 0));

          const id = newAttachmentId();
          const encrypted = await encryptBinary(await file.arrayBuffer(), masterCryptoKey, id);
          await dbPut('attachments', encrypted);
          addedIds.push(id);
          currentAttachments.push({
            id,
            name: file.name,
            type: file.type || 'application/octet-stream',
            size: file.size
          });
          currentTotalBytes += file.size;
          addedCount++;
        }
      } catch (err) {
        currentAttachments = originalAttachments;
        await Promise.all(addedIds.map(id => dbDelete('attachments', id).catch(() => {})));
        renderAttachments();
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'ATTACHMENT SAVE FAILED';
        console.error('Could not encrypt/store attachment:', err);
        return;
      }

      if (addedCount > 0) {
        const hasImg = files.some(f => (f.type || '').startsWith('image/'));
        const activeNote = decryptedNotes.find(n => n.id === currentNoteId);
        const previousCategory = activeNote?.category;
        if (activeNote && activeNote.category === 'TEXT') {
          activeNote.category = hasImg ? 'IMAGE' : 'FILE';
          updateEditorCategoryIcon(activeNote.category);
        }
        renderAttachments();
        try {
          await saveCurrentNote();
        } catch (err) {
          currentAttachments = originalAttachments;
          if (activeNote && previousCategory) {
            activeNote.category = previousCategory;
            updateEditorCategoryIcon(previousCategory);
          }
          await Promise.all(addedIds.map(id => dbDelete('attachments', id).catch(() => {})));
          renderAttachments();
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = 'ATTACHMENT SAVE FAILED'; ///////////
          console.error('Could not save attachment metadata to note:', err);
          return;
        }
      }

      if (skippedTooLarge > 0 || skippedDuplicate > 0) {
        const msgParts = [];
        if (skippedDuplicate > 0) msgParts.push(`${skippedDuplicate} duplicate`);
        if (skippedTooLarge > 0) msgParts.push(`${skippedTooLarge} >15MB limit`);
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = `Skipped (${msgParts.join(', ')})`;
        setTimeout(() => {
          if (statusEl) {
            statusEl.textContent = '';
            statusEl.style.color = 'var(--success)';
          }
        }, 3500);
      }
    }

    function initAttachmentDragAndDrop() {
      const dropZone = document.getElementById('attachments-bar');
      if (!dropZone) return;

      let dragCounter = 0;

      // Chặn trình duyệt tự mở file khi thả lệch ra ngoài
      window.addEventListener('dragover', e => e.preventDefault());
      window.addEventListener('drop', e => e.preventDefault());

      dropZone.addEventListener('dragenter', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter++;
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropZone.classList.remove('drag-over');
        }
      });

      dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        dropZone.classList.remove('drag-over');

        const files = Array.from(e.dataTransfer?.files || []);
        if (files.length > 0) {
          await processAttachmentFiles(files);
        }
      });
    }

    function renderAttachments() {
      const grid = document.getElementById('attachment-grid');
      if (!grid) return;
      grid.replaceChildren();
      if (!currentAttachments.length) {
        const hint = document.createElement('span');
        hint.className = 'att-empty-hint';
        hint.textContent = 'Drop here'; ///////////////////////////
        grid.appendChild(hint);
        return;
      }

      for (const att of currentAttachments) {
        if (!att || typeof att.id !== 'string') continue;
        const isImg = typeof att.type === 'string' && att.type.startsWith('image/');
        const pill = document.createElement('div');
        pill.className = 'att-pill';
        pill.title = `${String(att.name || 'Attachment')} (${formatBytes(Number(att.size) || 0)})`;

        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'att-open';
        open.setAttribute('aria-label', `${isImg ? 'View image' : 'Download file'} ${String(att.name || 'Attachment')}`);
