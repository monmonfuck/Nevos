<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Secret Vault" />
  <title>Noves</title>
  <style>
    :root {
      --bg-primary: #090a0f;
      --bg-glass: rgba(15, 17, 26, 0.65);
      --bg-glass-hover: rgba(255, 255, 255, 0.05);
      --bg-input: rgba(0, 0, 0, 0.3);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --danger: #ff453a;
      --success: #30d158;
      --warning: #ffd60a;
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    button, .topbar, .category-pills, .note-card {
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea, select, button { font-size: 14px; color: var(--text-main); outline: none; border: none; background: transparent; }

    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      cursor: text;
      caret-color: #ffffff !important;
      transform: translateZ(0); /* Ép render lớp con trỏ nháy tách khỏi backdrop-filter */
    }



    /* LOCK SCREEN (Giữ nguyên từ Phase 1) */
    #lock-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: url('Cubist.png') center/cover no-repeat, var(--bg-primary); /* ////////////////////////////////////////////// */
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-card { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: formFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .view-pane { width: 100%; display: flex; flex-direction: column; gap: 16px; transition: all 0.4s ease; }
    @keyframes formFadeIn { from { opacity: 0; transform: translateY(10px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    .pwd-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .text-input { width: 100%; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 18px 48px; border-radius: 999px; color: #fff; font-size: 15px; letter-spacing: 2px; text-align: center; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    .text-input:focus { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
    .text-input::placeholder { color: rgba(255, 255, 255, 0.4); letter-spacing: 1px; font-weight: 400; }
    .field-icon-left { position: absolute; left: 20px; opacity: 0.5; display: flex; pointer-events: none; }
    .eye-icon { position: absolute; right: 20px; cursor: pointer; opacity: 0.3; transition: all 0.2s; display: flex; align-items: center; justify-content: center; padding: 5px; }
    .eye-icon:hover { opacity: 0.9; }
    .btn-auth { width: 100%; background: rgba(255, 255, 255, 0.9); color: #000; border: none; border-radius: 999px; padding: 16px; font-weight: 600; letter-spacing: 1.5px; cursor: pointer; margin-top: 8px; transition: all 0.3s; }
    .btn-auth:hover { background: #fff; transform: scale(1.02); }
    #import-view { display: none; animation: formFadeIn 0.4s ease; }
    .import-btn { width: 100%; height: 120px; background: transparent; border: 1px dashed rgba(255, 255, 255, 0.3); color: rgba(255, 255, 255, 0.8); border-radius: 24px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; }
    .import-btn:hover { border-color: #fff; color: #fff; background: rgba(255, 255, 255, 0.05); }
    .dot-wrapper { margin-top: 16px; height: 40px; display: flex; align-items: center; justify-content: center; }
    /* 1. Hiệu ứng nhấn/lướt cho nút Chấm & nút Back */
    .dot-btn { 
      width: 8px; height: 8px; border-radius: 50%; 
      background-color: rgba(255, 255, 255, 0.4); cursor: pointer; 
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); 
      display: flex; align-items: center; justify-content: center; color: transparent; 
    }
    .dot-btn:hover { background-color: rgba(255, 255, 255, 0.9); transform: scale(1.6); }
    .dot-btn:active { transform: scale(0.85); }
    .dot-btn.back-mode { 
      width: 36px; height: 36px; background-color: rgba(0, 0, 0, 0.4); 
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.8); 
      transform: scale(1); 
    }
    .dot-btn.back-mode:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      transform: scale(1.12) translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .dot-btn.back-mode:active {
      transform: scale(0.92);
    }
    .status-msg { font-size: 12px; text-align: center; min-height: 20px; color: rgba(255, 255, 255, 0.6); }

    /* MAIN WORKSPACE - UX/UI Phase 2 + Phase 4 */
    #app-container {
      display: none; flex: 1; flex-direction: column;
      min-height: 0; overflow: hidden;
      background: url('bbb.png') center/cover no-repeat;
    }
    .app-overlay {
      flex: 1; display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 16px; gap: 16px;
    }

    /* Glass Panels (Bỏ backdrop-filter lặp lần 2 để tránh lỗi mất caret trên WebKit) */
    .glass-panel {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .topbar {
      position: relative; z-index: 200;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; }
    .badge-aes { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .search-box {
      background: var(--bg-input); border-radius: 999px; padding: 8px 16px;
      display: flex; align-items: center; gap: 8px; width: 300px; border: 1px solid var(--border);
    }
    .search-box input { width: 100%; font-size: 13px; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn { 
      background: transparent; border: 1px solid transparent; color: var(--text-muted); 
      width: 34px; height: 34px; border-radius: var(--radius-sm); 
      display: flex; align-items: center; justify-content: center; cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
    }
    .icon-btn:hover { background: var(--bg-glass-hover); color: #fff; border-color: var(--border); transform: scale(1.06); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.lock-btn { border-color: var(--border); background: rgba(0,0,0,0.2); }
    .icon-btn.lock-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* Workspace Split (Thêm min-height: 0 để cho phép cuộn độc lập) */
    .workspace { position: relative; z-index: 10; display: flex; flex: 1; min-height: 0; gap: 16px; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 320px; height: 100%; min-height: 0; display: flex; flex-direction: column; flex-shrink: 0; padding: 16px; gap: 12px; overflow: hidden; }
    .btn-new {
      background: var(--accent); color: #fff; padding: 12px; border-radius: var(--radius-md);
      font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: 0.2s; justify-content: center; flex-shrink: 0;
    }
    .btn-new:hover { background: var(--accent-hover); }

    .category-pills { display: flex; gap: 8px; justify-content: space-between; flex-shrink: 0; }
    .pill {
      width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: 0.2s;
    }
    .pill:hover { background: var(--bg-glass-hover); color: #fff; }
    .pill.active { background: rgba(10, 132, 255, 0.2); color: var(--accent); border-color: rgba(10, 132, 255, 0.4); }
    .pill.drag-over { color: #fff; background: rgba(10, 132, 255, 0.3); border-color: var(--accent); transform: translateY(-2px) scale(1.08); box-shadow: 0 0 0 3px rgba(10,132,255,.14); }
    .category-pills { position: relative; }
    .cat-label { display: inline-flex; align-items: center; white-space: nowrap; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 5px 9px; background: rgba(255,255,255,.035); }

    /* General note drag + radial action wheel */
    .note-card { touch-action: pan-y; }
    .note-card.dragging-note { opacity: .22; border-color: var(--accent); }
    .note-card.dragging-pin { opacity: .9; background: rgba(10,132,255,.22); border-color: var(--accent); transform: scale(1.02); z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .note-card-icon { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
    .note-card-icon.pin-drag-handle, .note-card-icon { touch-action: none; cursor: grab; }
    .note-drag-active, .note-drag-active * { -webkit-user-select: none !important; user-select: none !important; }
    .note-drag-active { cursor: grabbing !important; }
    .note-drag-active #note-list .note-card:not(.note-drag-source) { pointer-events: none !important; }
    .note-drag-ghost { position: fixed; z-index: 10050; pointer-events: none; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-md); color: var(--text-main); background: rgba(19,22,33,.94); border: 1px solid var(--accent); box-shadow: 0 18px 50px rgba(0,0,0,.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); overflow: hidden; transition: width .16s ease, height .16s ease, border-radius .16s ease, padding .16s ease; }
    .note-drag-ghost.compact { width: 44px !important; height: 44px !important; padding: 5px; border-radius: 50%; justify-content: center; }
    .note-drag-ghost.compact .note-card-info { display: none; }
    .note-drag-ghost.compact .note-card-icon { width: 32px; height: 32px; border-radius: 50%; }
    #note-action-dot { position: fixed; right: 22px; bottom: 22px; z-index: 12020; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.75); background: rgba(255,255,255,.6); box-shadow: 0 0 0 5px rgba(255,255,255,.07), 0 4px 16px rgba(0,0,0,.45); cursor: pointer; padding: 0; transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
    #note-action-dot:hover, #note-action-dot.open, #note-action-dot.drag-over { transform: scale(1.25); background: var(--accent); border-color: #fff; box-shadow: 0 0 0 8px rgba(10,132,255,.16), 0 4px 18px rgba(0,0,0,.5); }
    #note-action-wheel { position: fixed; inset: 0; z-index: 12010; pointer-events: none; }
    #note-action-wheel.show { pointer-events: none; }
    .note-action-item { position: fixed; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); color: var(--text-main); background: rgba(18,20,30,.96); box-shadow: 0 10px 26px rgba(0,0,0,.5); cursor: pointer; pointer-events: auto; opacity: 0; transform: translate(-50%,-50%) scale(.3); transition: opacity .18s ease, transform .22s cubic-bezier(.16,1,.3,1), background .18s ease, border-color .18s ease; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    #note-action-wheel.show .note-action-item { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .note-action-item:hover, .note-action-item.drag-over { background: var(--accent); border-color: rgba(255,255,255,.75); transform: translate(-50%,-50%) scale(1.13) !important; }
    .note-action-item[data-action="delete"] { color: var(--danger); }
    .note-action-item[data-action="delete"]:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
    .note-action-item svg { width: 17px; height: 17px; }
    @media (max-width: 700px) { #note-action-dot { right: 16px; bottom: 16px; } .note-action-item { width: 40px; height: 40px; } }

    /* Khu vực cuộn danh sách Note + Nút cuộn Lên/Xuống */
    .note-list-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .note-list {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 8px; padding-right: 4px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .note-list::-webkit-scrollbar { width: 4px; }
    .note-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }

    /* Note Card & Hiệu ứng nhấn giữ icon để kéo xếp hạng Note Ghim */
    .note-card {
      padding: 12px; border-radius: var(--radius-md); border: 1px solid transparent; 
      cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .note-card:hover { background: var(--bg-glass-hover); border-color: var(--border); }
    .note-card.active { background: rgba(10, 132, 255, 0.1); border-color: rgba(10, 132, 255, 0.3); }
    .note-card.dragging-pin {
      opacity: 0.85; background: rgba(10, 132, 255, 0.22);
      border-color: var(--accent); transform: scale(1.02); z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .note-card-icon {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0;
      transition: 0.2s;
    }
    .note-card.active .note-card-icon { color: var(--accent); border-color: rgba(10, 132, 255, 0.3); background: rgba(10, 132, 255, 0.1); }
    .note-card-icon.pin-drag-handle { cursor: grab; touch-action: none; position: relative; }
    .note-card-icon.pin-drag-handle:hover { border-color: var(--accent); color: #fff; background: rgba(10, 132, 255, 0.2); }
    .note-card-icon.pin-drag-handle:active { cursor: grabbing; transform: scale(0.92); }
    .note-card-info { flex: 1; min-width: 0; }
    .note-card-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .note-card-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .note-card-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }

    /* Editor & Màn hình khóa riêng cho từng Note */
    .editor-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .empty-state { margin: auto; text-align: center; color: var(--text-muted); }

    #note-lock-view {
      display: none; margin: auto; width: 100%; max-width: 300px;
      flex-direction: column; align-items: center; gap: 12px;
      animation: formFadeIn 0.3s ease;
    }
    #note-lock-view.shake { animation: shakeError 0.35s ease; }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .editor-content { display: none; flex-direction: column; flex: 1; min-height: 0; padding: 24px; gap: 18px; overflow-y: auto; }
    .editor-content::-webkit-scrollbar { width: 6px; }
    .editor-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .editor-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .title-group { display: flex; align-items: center; gap: 12px; flex: 1; }
    .title-input { font-size: 20px; font-weight: 600; width: 100%; max-width: 300px; padding: 4px 0; }

    .editor-tools { display: flex; align-items: center; gap: 10px; }
    .btn-save { background: var(--accent); color: #fff; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-save:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-save:active { transform: scale(0.96); }

    .more-hover-wrap { position: relative; display: flex; align-items: center; }
    .more-trigger-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .more-hover-wrap:hover .more-trigger-btn {
      background: rgba(255,255,255,0.12); color: #fff;
      transform: scale(0.9);
      border-color: rgba(255,255,255,0.25);
    }
    .more-hover-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: rgba(18, 20, 30, 0.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius-md);
      padding: 6px; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.95);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); z-index: 150;
    }
    .more-hover-menu::before { content: ''; position: absolute; top: -10px; left: 0; right: 0; height: 10px; }
    .more-hover-wrap:hover .more-hover-menu {
      opacity: 1; visibility: visible; transform: translateY(0) scale(1);
    }

    /* Secret Box: Hiển thị rõ nháy nhập + viền sáng khi click vào */
    .secret-box {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 6px 14px; display: flex; align-items: center; gap: 10px; cursor: text;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .secret-box:focus-within {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.2);
    }
    .secret-box input {
      flex: 1; height: 28px; line-height: 28px; font-size: 14px;
      letter-spacing: 1px; color: #fff; caret-color: #fff !important;
    }
    .secret-actions { display: flex; align-items: center; gap: 4px; }

    .body-textarea { 
      flex: 1; width: 100%; min-height: 180px; resize: none; line-height: 1.6; font-size: 15px; 
      background: rgba(0, 0, 0, 0.18); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; 
    }
    .body-textarea:focus { border-color: rgba(255,255,255,0.22); }

    /* PHASE 4: Vùng kéo thả Attachments */
    .attachments-bar { 
      background: var(--bg-input); border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: var(--radius-md); 
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px;
      transition: all 0.22s ease; position: relative;
    }
    .attachments-bar.drag-over {
      border-color: var(--accent);
      background: rgba(10, 132, 255, 0.14);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2);
      transform: scale(1.005);
    }
    .att-left { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex: 1; pointer-events: auto; }
    .att-left::-webkit-scrollbar { height: 4px; }
    .att-left::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    .att-empty-hint { font-size: 12px; color: var(--text-muted); opacity: 0.7; user-select: none; pointer-events: none; }

    .att-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .att-pill:hover { background: rgba(255,255,255,0.1); }
    .att-pill img { width: 16px; height: 16px; border-radius: 2px; object-fit: cover; }
    .btn-add-att { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; transition: 0.2s; }
    .btn-add-att:hover { border-color: #fff; color: #fff; transform: scale(1.08); }


    /* Workspace Split */
    .workspace { position: relative; z-index: 10; display: flex; flex: 1; gap: 16px; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 320px; display: flex; flex-direction: column; flex-shrink: 0; padding: 16px; gap: 16px; }
    .btn-new {
      background: var(--accent); color: #fff; padding: 12px; border-radius: var(--radius-md);
      font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: 0.2s; justify-content: center;
    }
    .btn-new:hover { background: var(--accent-hover); }

    .category-pills { display: flex; gap: 8px; justify-content: space-between; }
    .pill {
      width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: 0.2s;
    }
    .pill:hover { background: var(--bg-glass-hover); color: #fff; }
    .pill.active { background: rgba(10, 132, 255, 0.2); color: var(--accent); border-color: rgba(10, 132, 255, 0.4); }

    .note-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .note-list::-webkit-scrollbar { width: 4px; }
    .note-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* 4. Note Card với Icon tượng trưng ở đầu mỗi note */
    .note-card {
      padding: 12px; border-radius: var(--radius-md); border: 1px solid transparent; 
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px;
    }
    .note-card:hover { background: var(--bg-glass-hover); border-color: var(--border); }
    .note-card.active { background: rgba(10, 132, 255, 0.1); border-color: rgba(10, 132, 255, 0.3); }
    .note-card-icon {
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0;
    }
    .note-card.active .note-card-icon { color: var(--accent); border-color: rgba(10, 132, 255, 0.3); background: rgba(10, 132, 255, 0.1); }
    .note-card-info { flex: 1; min-width: 0; }
    .note-card-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .note-card-badges { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .note-card-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }

    /* Editor */
    .editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .empty-state { margin: auto; text-align: center; color: var(--text-muted); }
    .editor-content { display: none; flex-direction: column; flex: 1; padding: 24px; gap: 18px; overflow-y: auto; }
    .editor-content::-webkit-scrollbar { width: 6px; }
    .editor-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .editor-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .title-group { display: flex; align-items: center; gap: 12px; flex: 1; }
    .title-input { font-size: 20px; font-weight: 600; width: 100%; max-width: 300px; }

    .editor-tools { display: flex; align-items: center; gap: 10px; }
    .btn-save { background: var(--accent); color: #fff; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-save:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-save:active { transform: scale(0.96); }

    /* 6. Nút 3 chấm hover hiệu ứng nhấn & bung 3 icon (Pin, Star, Trash) */
    .more-hover-wrap { position: relative; display: flex; align-items: center; }
    .more-trigger-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .more-hover-wrap:hover .more-trigger-btn {
      background: rgba(255,255,255,0.12); color: #fff;
      transform: scale(0.9); /* Hiệu ứng nhấn xuống khi di chuột vào */
      border-color: rgba(255,255,255,0.25);
    }
    .more-hover-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: rgba(18, 20, 30, 0.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius-md);
      padding: 6px; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.95);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); z-index: 150;
    }
    /* Cầu nối tàng hình giúp di chuột từ nút 3 chấm xuống 3 icon không bị mất hover */
    .more-hover-menu::before { content: ''; position: absolute; top: -10px; left: 0; right: 0; height: 10px; }
    .more-hover-wrap:hover .more-hover-menu {
      opacity: 1; visibility: visible; transform: translateY(0) scale(1);
    }
    .more-hover-wrap.open .more-hover-menu {
      opacity: 1; visibility: visible; transform: translateY(0) scale(1);
    }
    .more-hover-wrap.open .more-trigger-btn {
      background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25);
    }

    /* 5. Bố cục 3 phần của Note: (1) Secret Box - (2) Body Textarea - (3) Attachments Zone */
    .secret-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .secret-box input { flex: 1; font-size: 14px; letter-spacing: 1px; }
    .secret-actions { display: flex; align-items: center; gap: 4px; }

    .body-textarea { 
      flex: 1; width: 100%; min-height: 180px; resize: none; line-height: 1.6; font-size: 15px; 
      background: rgba(0, 0, 0, 0.18); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; 
    }

    .attachments-bar { 
      background: var(--bg-input); border: 1px dashed rgba(255, 255, 255, 0.16); border-radius: var(--radius-md); 
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px;
    }
    .att-left { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex: 1; }
    .att-left::-webkit-scrollbar { height: 4px; }
    .att-left::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    .att-empty-hint { font-size: 12px; color: var(--text-muted); opacity: 0.6; user-select: none; }

    .att-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .att-pill:hover { background: rgba(255,255,255,0.1); }
    .att-pill img { width: 16px; height: 16px; border-radius: 2px; object-fit: cover; }
    .btn-add-att { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; transition: 0.2s; }
    .btn-add-att:hover { border-color: #fff; color: #fff; transform: scale(1.08); }

    /* Dropdown Menu (Đã làm đậm nền chống xuyên thấu đè chữ) */
    .menu-dropdown { position: relative; }
    .menu-content { 
      display: none; position: absolute; top: calc(100% + 8px); right: 0; 
      background: rgba(18, 20, 30, 0.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: var(--radius-md);

    }
    .menu-content.show { display: block; }
    .menu-item { width: 100%; text-align: left; padding: 9px 12px; border-radius: 6px; cursor: pointer; color: var(--text-main); font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.08); }
    .menu-item.danger { color: var(--danger); }
    .menu-item.danger:hover { background: rgba(255, 69, 58, 0.15); }

    #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 12px; }

        /* PHASE 3: MINIMALIST GLASS MODAL (SELF-DESTRUCT & IMPORT AUTH) */
    .vault-modal-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .vault-modal-overlay.show { display: flex; }
    .vault-modal-card {
      width: 100%; max-width: 340px; padding: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      animation: formFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-title {
      font-size: 13px; font-weight: 600; letter-spacing: 2px;
      color: var(--text-main); text-transform: uppercase; text-align: center;
    }
    .modal-actions {
      width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
    }
    .modal-row {
      width: 100%; display: flex; gap: 8px;
    }
    .btn-modal {
      flex: 1; padding: 13px 14px; border-radius: 999px; font-size: 12px;
      font-weight: 600; letter-spacing: 1.2px; cursor: pointer;
      transition: all 0.25s ease; text-align: center; text-transform: uppercase;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06); color: var(--text-main);
    }
    .btn-modal:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
    .btn-modal:active { transform: scale(0.97); }
    .btn-modal.primary { background: rgba(255, 255, 255, 0.9); color: #000; border: none; }
    .btn-modal.primary:hover { background: #fff; }
    .btn-modal.danger { background: rgba(255, 69, 58, 0.18); color: var(--danger); border-color: rgba(255, 69, 58, 0.35); }
    .btn-modal.danger:hover { background: var(--danger); color: #fff; }
    .btn-modal.warn { background: rgba(10, 132, 255, 0.18); color: var(--accent-hover); border-color: rgba(10, 132, 255, 0.35); }
    .btn-modal.warn:hover { background: var(--accent); color: #fff; }


    .rainbow-text { /* Hiệu ứng chữ gradient cầu vồng */
        background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
        background-size: 200% auto;
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        animation: rainbow 3s linear infinite;
    }

    @keyframes rainbow {
        to { background-position: 200% center; }
    }



    /* PHASE 5: lightweight spreadsheet notes + small regression fixes */
    .lock-card { animation: none; }
    #import-view { animation: none; }
    .view-pane { transition: none; }
    #lock-screen.file-drag-over .lock-card {
      outline: 1px dashed var(--accent); outline-offset: 14px;

    .new-note-actions { display:flex; gap:8px; flex-shrink:0; }
    .new-note-actions .btn-new { flex:1; min-width:0; }
    .new-note-actions .table-new-note { flex:0 0 48px; padding:10px; background:rgba(10,132,255,.16); border:1px solid rgba(10,132,255,.35); }
    .new-note-actions .table-new-note:hover { background:rgba(10,132,255,.3); }
    #editor-type-icon { flex-shrink:0; }

    #note-category-label { flex-shrink:0; margin-left:2px; }
    .title-group { min-width:0; overflow:hidden; }

    .btn-add-att { position:relative; top:3px; }
    #note-table-wrap { display:none; flex:1; min-height:180px; flex-direction:column; gap:10px; overflow:hidden; }
    .sheet-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .sheet-toolbar-label { margin-right:auto; font-size:12px; color:var(--text-muted); letter-spacing:.04em; }
    .sheet-btn { border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text-main); background:rgba(255,255,255,.05); cursor:pointer; font-size:12px; white-space:nowrap; }
    .sheet-btn:hover { background:rgba(10,132,255,.18); border-color:rgba(10,132,255,.45); }
    .sheet-scroll { flex:1; min-height:0; overflow:auto; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,.14); }
    .sheet-grid { border-collapse:separate; border-spacing:0; min-width:100%; width:max-content; color:var(--text-main); }
    .sheet-grid th, .sheet-grid td { min-width:140px; padding:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
    .sheet-grid th { min-width:52px; width:52px; background:rgba(255,255,255,.055); color:var(--text-muted); font-size:11px; font-weight:500; text-align:center; position:sticky; z-index:1; }
    .sheet-grid thead th { top:0; height:34px; }

    .sheet-head-content { display:flex; justify-content:center; align-items:center; gap:5px; padding:4px; }
    .sheet-remove { width:18px; height:18px; border-radius:5px; color:var(--text-muted); cursor:pointer; line-height:1; }
    .sheet-remove:hover { color:#fff; background:rgba(255,69,58,.25); }
    .sheet-cell { display:block; width:100%; min-width:140px; height:34px; padding:7px 9px; color:var(--text-main); background:transparent; border:0; border-radius:0; font-size:13px; }
    .sheet-cell:focus { outline:2px solid rgba(10,132,255,.75); outline-offset:-2px; }
    .sheet-help { color:var(--text-muted); font-size:11px; }
    /* The note list keeps its own pointer-driven touch scrolling so long-press drag can start anywhere on a card. */
    .note-card { touch-action:none; }
    .sheet-grid thead th:not(:first-child) { min-width:140px; width:auto; }
    .sheet-head-content { min-width:0; }
    .sheet-header-input {
      display:block; width:100%; min-width:0; height:24px; padding:2px 4px;

    }
    .sheet-header-input:hover { border-color:rgba(255,255,255,.13); }

    .sheet-grid tbody th .sheet-header-input { width:100%; max-width:88px; }
    .sheet-grid .sheet-cell.selected { box-shadow:inset 0 0 0 2px rgba(10,132,255,.9); }
    .sheet-grid.sheet-selecting, .sheet-grid.sheet-selecting * { -webkit-user-select:none !important; user-select:none !important; }
    .sheet-color-context {
      position:fixed; z-index:13050; display:none; flex-direction:column; gap:10px;
      width:min(270px, calc(100vw - 16px)); padding:12px; border-radius:12px;
      border:1px solid rgba(255,255,255,.18); background:rgba(18,20,30,.98);

    .sheet-color-context.show { display:flex; }

    .sheet-color-controls input[type="color"] { width:38px; height:36px; padding:2px; border:1px solid var(--border); border-radius:7px; background:transparent; }
    .sheet-color-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .sheet-color-actions button { flex:1; min-width:70px; }

    @media (max-width:700px) {

    @media (max-width: 700px) {
      .workspace { flex-direction: column; }

      .workspace:not(.editing) .editor-pane { display: none !important; }

    /* Chặn bôi đen các nhãn giao diện và tiêu đề trong danh sách Note */
    #note-category-label,
    .note-card-title,
    .att-empty-hint {
      -webkit-user-select: none !important;
      user-select: none !important;

      -webkit-user-select: none !important;

    /* ------------------------------------------------------------------
       iPhone UX remake — CSS only. Desktop/iPad rules and app logic stay intact.
       Compact navigation, one primary task per screen, safe-area + thumb targets.
    ------------------------------------------------------------------ */

    /* Keep a dragged pinned card inside the scroll-list's clipping box.
       Scaling the source card made its 1px left border paint outside overflow-x:hidden. */

        width: 100%;
        height: 100%;

      .app-overlay {

                 max(10px, env(safe-area-inset-right))

        height: 18px;

      }

      .badge-aes { display: none !important; }

      .topbar-actions {
        grid-column: 2;
        grid-row: 1;
        gap: 2px;
        margin-left: 0;
        min-width: 0;
        justify-content: flex-end;
      }

      #autolock-indicator {
        font-size: 10px !important;
        padding: 5px 6px;
        border: 1px solid var(--border);

      }

      .topbar-actions > div[style*="background"] {
        flex: 0 0 auto;
        padding: 1px !important;
        border-radius: 10px !important;
      }

      .topbar-actions > div[style*="background"] .icon-btn {
        width: 31px !important;
        height: 33px !important;
      }

      .topbar-actions .icon-btn {
        width: 35px;
        height: 35px;
        border-radius: 10px;
      }

      .search-box {
        grid-column: 1 / -1;
        grid-row: 2;
        order: initial;
        flex: none;
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 0 12px;
        border-radius: 12px;
        gap: 9px;
        background: rgba(255,255,255,.045);
      }

      .search-box input {
        min-width: 0;
        padding: 9px 0;
        font-size: 16px;
      }

      /* iPhone behaves as a native single-column flow, not a compressed split view. */
      .workspace {
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 8px;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        width: 100%;
        height: auto;
        max-height: none;
        min-height: 0;
        flex: 1 1 auto;
        padding: 10px;
        gap: 12px;
        border-radius: 16px;
        overflow: hidden;
      }

      .new-note-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .new-note-actions .btn-new:first-child {
        flex: 1 1 auto;
        min-width: 0;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        justify-content: center;
        gap: 8px;
        font-size: 0;
      }

      .new-note-actions .btn-new:first-child::before {
        content: "+";
        display: inline-block;
        font-size: 23px;
        font-weight: 400;
        line-height: 1;
      }

      .new-note-actions .btn-new:first-child::after {
        content: "New";
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .01em;
      }

      .new-note-actions .table-new-note {
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 12px;
      }

      .category-pills {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        align-items: stretch;
        justify-content: initial;
        flex: 0 0 auto;
        gap: 4px;
        min-width: 0;
      }

      .pill {
        width: 100%;
        min-width: 0;
        height: 40px;
        min-height: 40px;
        border-radius: 11px;
      }

      .pill svg { width: 16px; height: 16px; }

      .note-list {
        flex: 1 1 auto;
        min-height: 0;
        padding: 2px 3px 5px;
        gap: 7px;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-behavior: auto;
        scrollbar-width: none;
      }

      .note-list::-webkit-scrollbar { display: none; }

      .note-card {
        min-width: 0;
        min-height: 62px;
        padding: 10px;
        gap: 11px;
        border: 1px solid rgba(255,255,255,.055);
        border-radius: 13px;
        background: rgba(255,255,255,.022);
        transition: background .16s ease, border-color .16s ease;
      }

      .note-card:hover {
        background: rgba(255,255,255,.045);
        border-color: var(--border);
      }

      .note-card.active {
        background: rgba(10,132,255,.105);
        border-color: rgba(10,132,255,.38);
      }

      .note-card-icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
      }

      .note-card-title {
        min-width: 0;
        gap: 5px;
        margin-bottom: 4px;
        font-size: 14px;
        line-height: 1.25;
      }

      .note-card-badges { gap: 4px; }
      .note-card-meta { gap: 5px; font-size: 10px; line-height: 1.25; }

      /* Detail screen: hide the redundant search row and give the editor the viewport. */
      .app-overlay:has(.workspace.editing) .topbar {
        grid-template-rows: auto;
        min-height: 46px;
        padding: 5px 7px;
        gap: 0;
      }

      .app-overlay:has(.workspace.editing) .search-box {
        display: none !important;
      }

      .workspace.editing .sidebar { display: none !important; }

      .workspace.editing .editor-pane {
        display: flex !important;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        border-radius: 16px;
      }

      .workspace:not(.editing) .editor-pane { display: none !important; }
      .workspace:not(.editing) .sidebar { display: flex !important; width: 100%; height: 100%; flex: 1 1 auto; }

      .editor-content {
        min-width: 0;
        min-height: 0;
        padding: 12px 12px max(14px, env(safe-area-inset-bottom));
        gap: 10px;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .editor-header {
        position: sticky;
        top: -12px;
        z-index: 20;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        grid-template-areas:
          "back title"
          "tools tools";
        align-items: center;
        gap: 7px 9px;
        margin: -12px -12px 0;
        padding: 10px 12px 9px;
        border-bottom: 1px solid var(--border);
        background: rgba(15,17,26,.94);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
      }

      #mobile-editor-back {
        display: flex;
        grid-area: back;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border-radius: 12px;
      }

      .title-group {
        grid-area: title;
        display: flex;
        width: 100%;
        min-width: 0;
        flex: initial;
        gap: 7px;
        overflow: hidden;
      }

      #editor-type-icon { flex: 0 0 auto; }

      .title-input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        padding: 5px 0;
        font-size: 18px;
        line-height: 1.3;
      }

      #note-category-label { display: none !important; }

      .editor-tools {
        grid-area: tools;
        display: flex;
        width: 100%;
        min-width: 0;
        justify-content: flex-end;
        align-items: center;
        gap: 7px;
      }

      #save-status {
        max-width: calc(100% - 105px);
        margin-right: auto !important;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px !important;
      }

      .btn-save {
        min-width: 78px;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 11px;
        justify-content: center;
        white-space: nowrap;
      }

      .more-trigger-btn,
      .more-hover-wrap > .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 11px;
      }

      .more-hover-wrap:hover .more-trigger-btn { transform: none; }

      .more-hover-menu {
        top: auto;
        right: 0;
        bottom: calc(100% + 6px);
        max-width: calc(100vw - 24px);
        flex-wrap: nowrap;
      }

      .secret-box {
        min-width: 0;
        min-height: 48px;
        flex: 0 0 auto;
        padding: 4px 10px;
        gap: 8px;
        border-radius: 12px;
      }

      .secret-box input {
        min-width: 0;
        height: 36px;
        line-height: 36px;
        font-size: 16px;
        letter-spacing: .04em;
      }

      .secret-actions { gap: 2px; }
      .secret-actions .icon-btn { width: 34px !important; height: 34px !important; }

      .body-textarea {
        min-width: 0;
        min-height: 220px;
        flex: 1 0 220px;
        padding: 13px;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.55;
      }

      .attachments-bar {
        min-width: 0;
        min-height: 54px;
        flex: 0 0 auto;
        padding: 8px 10px;
        gap: 8px;
        border-radius: 12px;
      }

      .att-left { min-width: 0; gap: 8px; }
      .btn-add-att { width: 36px; height: 36px; }
      .att-pill { max-width: 62vw; overflow: hidden; }

      #note-table-wrap {
        min-width: 0;
        min-height: 220px;
        flex: 1 0 220px;
        gap: 8px;
      }

      .sheet-toolbar { gap: 6px; }
      .sheet-toolbar-label { width: auto; font-size: 11px; }
      .sheet-btn { min-height: 36px; padding: 7px 9px; border-radius: 9px; }
      .sheet-scroll { min-height: 150px; }
      .sheet-grid th, .sheet-grid td,
      .sheet-grid thead th:not(:first-child),
      .sheet-cell { min-width: 112px; }
      .sheet-cell { height: 40px; padding: 8px; font-size: 16px; }
      .sheet-header-input { font-size: 13px; }

      #note-lock-view {
        width: min(100%, 320px);
        max-width: 320px;
        margin: auto;
        padding: 12px 4px;
        gap: 12px;
      }

      #note-lock-view .text-input { font-size: 16px; }
      #note-lock-view .sheet-btn {
        width: 100%;
        min-height: 44px;
        margin-top: 4px;
        border-radius: 12px;
        font-size: 0;
      }

      #note-lock-view .sheet-btn::after {
        content: "Back";
        font-size: 13px;
      }

      .vault-modal-overlay {
        align-items: center;
        padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      }

      .vault-modal-card {
        width: 100%;
        max-width: 400px;
        max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        padding: 20px 18px;
        overflow-y: auto;
        border-radius: 20px;
      }

      #note-action-dot {
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
      }

      /* Keep the visual action dot tiny, but make its tap target comfortable. */
      #note-action-dot::before {
        content: "";
        position: absolute;
        width: 44px;
        height: 44px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }

      .note-action-item { width: 44px; height: 44px; }

      /* The compact drag ghost remains above the list without clipping its own glyph. */
      .note-drag-ghost.compact {
        width: 44px !important;
        height: 44px !important;
        min-width: 44px;
        min-height: 44px;
        padding: 5px;
        overflow: visible;
        border-radius: 50%;
      }

      .note-drag-ghost.compact .note-card-icon {
        width: 32px;
        height: 32px;
        min-width: 32px;
        min-height: 32px;
        flex: 0 0 32px;
        border-radius: 50%;
      }
    }

    /* NEVOS: Chặn giao diện khi iPhone nằm ngang */
    #orientation-warning {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2147483647;
        background: #090a0f;
        color: #f5f5f7;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #orientation-warning .orientation-icon {
        font-size: 48px;
        margin-bottom: 24px;
    }

    #orientation-warning h2 {
        font-size: 23px;
        margin: 0 0 12px;
    }

    #orientation-warning p {
        font-size: 15px;
        line-height: 1.6;
        color: #b7b7bd;
        max-width: 320px;
        margin: 0;
    }

    @media screen and (orientation: landscape) and (max-height: 600px) {
        #orientation-warning {
            display: flex;
        }

        body > *:not(#orientation-warning) {
            visibility: hidden !important;
        }

        body > #orientation-warning {
            visibility: visible !important;
        }
    }


</style>
</head>
<body>

  <!-- ================= 1. MÀN HÌNH KHÓA & KHỞI TẠO KHO MẬT ================= -->

  <div id="lock-screen">
    <div class="lock-card">
      
      <!-- AUTH VIEW (Giao diện nhập mật khẩu) -->
      <div id="auth-view" class="view-pane">
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" style="display:flex; flex-direction:column; gap:16px;">
          
          <div class="pwd-wrapper">
            <span class="field-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="password" id="master-pass" class="text-input" placeholder=" " required autocomplete="current-password" />
            <span class="eye-icon" onclick="toggleVisibility('master-pass')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>

          <div class="pwd-wrapper" id="confirm-group" style="display: none;">
            <span class="field-icon-left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="master-pass-confirm" class="text-input" placeholder=" " autocomplete="new-password" />
            <span class="eye-icon" onclick="toggleVisibility('master-pass-confirm')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>

          <button type="submit" class="btn-auth" id="auth-btn">ENTER</button> <!------////////////////////////// ---------->
        </form>
        <div class="status-msg" id="auth-status"></div>
      </div>

      <!-- IMPORT VIEW (Giao diện kéo thả / chọn file vault) -->

      <div id="import-view" class="view-pane">
        <button type="button" class="import-btn" onclick="document.getElementById('restore-file-input').click()">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <input type="file" id="restore-file-input" accept=".vault,application/json" style="display:none" onchange="restoreVaultFromLockScreen(event)" />
      </div>


      <!-- NÚT CHẤM / BACK -->
      <div class="dot-wrapper">
        <button type="button" id="dot-btn" class="dot-btn" onclick="toggleAuthMode()"></button>
      </div>

    </div>
  </div>


  <!-- ================= 2. GIAO DIỆN CHÍNH SAU KHI GIẢI MÃ ================= -->

  <div id="app-container">
    <div class="app-overlay">
      
      <!-- Topbar -->
      <header class="topbar glass-panel">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          Nevos 
          <span class="badge-aes"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-1V7c0-3.31-2.69-6-6-6S6 3.69 6 7v4H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V13c0-1.1-.9-2-2-2zm-7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 11V7c0-1.66 1.34-3 3-3s3 1.34 3 3v4H9z"></path></svg> AES-256</span>
        </div>
        
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" stroke="var(--text-muted)" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search..." oninput="renderNoteList()" />
        </div>

        <div class="topbar-actions">

          <div style="display: flex; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px;">
            <button class="icon-btn" onclick="exportEncryptedVault()" title="Export .vault" style="border:none; background:none; width:30px; height:30px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></button>
            <button class="icon-btn" onclick="document.getElementById('import-merge-input').click()" title="Import .vault" style="border:none; background:none; width:30px; height:30px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>

          <!-- Cài đặt -->
          <div class="menu-dropdown">
            <button class="icon-btn" onclick="toggleMenu('settings-menu')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            <div id="settings-menu" class="menu-content">
              <button class="menu-item" onclick="changeMasterPassword()">Change Password</button>
              <button class="menu-item danger" onclick="panicWipeVault()">Self-destruct</button> <!---//////////////////////// ------->
            </div>
          </div>

          <button class="icon-btn lock-btn" onclick="lockVault()" title="Lock Vault">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </button>
        </div>
      </header>

      <!-- Workspace Body -->
      <div class="workspace">
        
        <!-- Sidebar -->

        <aside class="sidebar glass-panel">

          <div class="new-note-actions">
            <button class="btn-new" onclick="createNewNote()" title="New note" aria-label="New note">+</button>
            <button class="btn-new table-new-note" onclick="createNewTableNote()" title="New spreadsheet note" aria-label="New spreadsheet note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path></svg>
            </button>
          </div>
          
          <div class="category-pills">
            <div class="pill active" data-category="ALL" onclick="setCategoryFilter('ALL', this)" title="All"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div>
            
            <!-- NÚT STAR NẰM CẠNH NÚT ALL//////////////////////////////// -->

  <script>
    // === THÊM HÀM NÀY VÀO TRONG SCRIPT ĐỂ XỬ LÝ DROPDOWN MENU ===
    function toggleMenu(menuId) {

      if (!wrapper) return;
      const shouldOpen = !wrapper.classList.contains('open');

        item.querySelector('.more-trigger-btn')?.setAttribute('aria-expanded', 'false');

        wrapper.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');

    /********************************************************************
     * 1. LÕI MÃ HÓA QUÂN ĐỘI WEB CRYPTO API (AES-256-GCM + PBKDF2)
     ********************************************************************/
    const DB_NAME = 'AppleSecretVaultDB';
    const DB_VERSION = 2;
    const PBKDF2_ITERATIONS = 600000; // Chuẩn OWASP chống vét cạn bằng GPU
    const MAGIC_VERIFIER = 'APPLE_SECRET_VAULT_VERIFIED_V1';

    let db = null;
    let masterCryptoKey = null; // Chỉ lưu trên RAM, không bao giờ ghi xuống ổ cứng
    let vaultSalt = null;
    let decryptedNotes = []; // Chỉ tồn tại trên RAM khi mở khóa
    let currentNoteId = null;
    let currentCategoryFilter = 'ALL';
    let currentAttachments = [];
    let inactivitySeconds = 180; // Tự khóa sau 180 giây (3 phút)
    let timerInterval = null;
    let clipboardClearTimer = null;

    const vaultTabId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const vaultSyncChannel = typeof BroadcastChannel !== 'undefined'
      ? new BroadcastChannel('noves_vault_sync')
      : null;
    if (vaultSyncChannel) {
      vaultSyncChannel.addEventListener('message', event => {
        const message = event.data;
        if (!message || message.sender === vaultTabId) return;
        if (['lock', 'password-change', 'import'].includes(message.type)) {
          void lockVault(
            message.type === 'lock' ? 'Kho đã được khóa ở tab khác.' : 'Kho đang được thay đổi ở tab khác.',
            { remote: true }
          );
        }
      });
    }

    function notifyVaultSync(type, reason = '') {
      try {
        vaultSyncChannel?.postMessage({ type, reason, sender: vaultTabId, at: Date.now() });
      } catch (err) {
        console.warn('Không thể gửi tín hiệu đồng bộ giữa các tab:', err);
      }
    }

    // Chuyển đổi ArrayBuffer <-> Base64 theo từng khối 32KB (Chống tràn bộ nhớ khi đính kèm file/ảnh lớn)
    function bufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToBuffer(b64) {
      const binary = atob(b64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Dẫn xuất khóa AES-256-GCM từ Master Password
    async function deriveKeyFromPassword(password, saltUint8) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltUint8,
          iterations: PBKDF2_ITERATIONS,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false, // extractable = false: Không cho phép trích xuất khóa thô khỏi RAM
        ['encrypt', 'decrypt']
      );
    }

    // Mã hóa một Object bất kỳ sang { iv, ciphertext }
    async function encryptObject(obj, key = masterCryptoKey) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(JSON.stringify(obj));
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        encoded
      );
      return {
        iv: bufferToBase64(iv.buffer),
        data: bufferToBase64(ciphertext)
      };
    }

    // Giải mã { iv, data } về Object ban đầu
    async function decryptObject(ivB64, dataB64, key = masterCryptoKey) {
      const iv = new Uint8Array(base64ToBuffer(ivB64));
      const ciphertext = base64ToBuffer(dataB64);
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        ciphertext
      );
      const jsonStr = new TextDecoder().decode(decryptedBuf);
      return JSON.parse(jsonStr);
    }

    // Encrypt raw file bytes once, independently from its note metadata.
    // The attachment ID is authenticated as additional data to prevent swapping blobs between IDs.
    async function encryptBinary(buffer, key = masterCryptoKey, attachmentId) {
      if (!attachmentId) throw new Error('MISSING ATTACHMENT ID');
      const rawBuffer = buffer instanceof ArrayBuffer
        ? buffer
        : ArrayBuffer.isView(buffer)
          ? buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength)
          : null;
      if (!rawBuffer) throw new Error('INVALID ATTACHMENT DATA');
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(String(attachmentId)) },
        key,
        rawBuffer
      );
      return { id: String(attachmentId), iv: bufferToBase64(iv.buffer), data: ciphertext };
    }

    async function decryptBinary(record, key = masterCryptoKey) {
      if (!record || typeof record.id !== 'string' || !record.id || !record.iv || !record.data) {
        throw new Error('ATTACHMENT NOT FOUND');
      }
      const iv = new Uint8Array(base64ToBuffer(record.iv));
      const ciphertext = typeof record.data === 'string' ? base64ToBuffer(record.data) : record.data;
      const rawBuffer = ciphertext instanceof ArrayBuffer
        ? ciphertext
        : ArrayBuffer.isView(ciphertext)
          ? ciphertext.buffer.slice(ciphertext.byteOffset, ciphertext.byteOffset + ciphertext.byteLength)
          : null;
      if (!rawBuffer) throw new Error('INVALID ATTACHMENT DATA');
      return crypto.subtle.decrypt(
        { name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(record.id) },
        key,
        rawBuffer
      );
    }

    function newAttachmentId() {
      return `att_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
    }

    function attachmentMetadata(att, id = att?.id) {
      return {
        id: String(id || newAttachmentId()),
        name: typeof att?.name === 'string' ? att.name : 'Attachment',
        type: typeof att?.type === 'string' && att.type ? att.type : 'application/octet-stream',
        size: Number.isFinite(Number(att?.size)) && Number(att.size) >= 0 ? Number(att.size) : 0
      };
    }

    function attachmentRecordForDatabase(record) {
      if (!record || typeof record.id !== 'string' || !record.id || typeof record.iv !== 'string') {
        throw new Error('CORRUPTED ATTACHMENT RECORD');
      }
      let data = record.data;
      if (typeof data === 'string') data = base64ToBuffer(data);
      if (ArrayBuffer.isView(data)) data = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
      if (!(data instanceof ArrayBuffer)) throw new Error('CORRUPTED ATTACHMENT DATA');
      return { id: record.id, iv: record.iv, data };
    }

    /********************************************************************
     * 2. CƠ SỞ DỮ LIỆU CỤC BỘ INDEXEDDB (CHỈ LƯU BẢN MÃ CIPHERTEXT)
     ********************************************************************/
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('meta')) {
            database.createObjectStore('meta', { keyPath: 'key' });
          }
          if (!database.objectStoreNames.contains('notes')) {
            database.createObjectStore('notes', { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains('attachments')) {
            database.createObjectStore('attachments', { keyPath: 'id' });
          }
        };
        req.onblocked = () => {
          const statusEl = document.getElementById('auth-status');
          if (statusEl) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'Please close any old Noves.'; ///////////////////////
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          db.onversionchange = () => {
            const oldDb = db;
            db = null;
            oldDb?.close();
            if (masterCryptoKey) void lockVault('The database has been upgraded in another tab.', { remote: true, skipSave: true }); /////////////////////
          };
          resolve(db);
        };
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function dbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll(storeName) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function dbPut(storeName, val) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).put(val);
        // Resolve only after the whole transaction commits; request success alone is not durable.
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || req.error || new Error('DATABASE WRITE FAILED'));
        tx.onabort = () => reject(tx.error || req.error || new Error('DATABASE WRITE ABORTED')); ///////////////////////
      });
    }

    function dbDelete(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function dbClear(storeName) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const req = tx.objectStore(storeName).clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const pass = document.getElementById('master-pass').value;
      const confirmPass = document.getElementById('master-pass-confirm').value;
      const statusEl = document.getElementById('auth-status');
      const btn = document.getElementById('auth-btn');

      statusEl.style.color = '#ffd60a';
      btn.disabled = true;

      try {
        if (isNewVault) {
          if (pass.length < 1) throw new Error('Password is required'); ///////////////////////////////////////////
          if (pass !== confirmPass) throw new Error('Passwords do not match');
          
          statusEl.textContent = 'ENCRYPTING...';
          await new Promise(r => setTimeout(r, 50));

          const salt = crypto.getRandomValues(new Uint8Array(16));
          const key = await deriveKeyFromPassword(pass, salt);
          const verifier = await encryptObject({ magic: MAGIC_VERIFIER, createdAt: Date.now() }, key);

          await dbPut('meta', {
            key: 'vault_header',
            salt: bufferToBase64(salt.buffer),
            verifierIv: verifier.iv,
            verifierData: verifier.data
          });

          masterCryptoKey = key;
          vaultSalt = salt;
          decryptedNotes = [];
          enterWorkspace();
        } else {
          statusEl.innerHTML = [...'DECRYPTING...'].map(char => `<span style="color:hsl(${Math.random()*360},100%,60%)">${char}</span>`).join(''); //////////////////
          await new Promise(r => setTimeout(r, 50));

          const header = await dbGet('meta', 'vault_header');
          const salt = new Uint8Array(base64ToBuffer(header.salt));
          const key = await deriveKeyFromPassword(pass, salt);

          const check = await decryptObject(header.verifierIv, header.verifierData, key);
          if (check.magic !== MAGIC_VERIFIER) throw new Error('Invalid Password');

          masterCryptoKey = key;
          vaultSalt = salt;
          await loadAllNotesIntoRAM();
          enterWorkspace();
        }
      } catch (err) {
        masterCryptoKey = null;
        decryptedNotes = [];
        statusEl.style.color = '#ff453a';
        statusEl.textContent = String(err.message || 'UNLOCK FAILED').toUpperCase(); ///////////////////////////////////
      } finally {
        btn.disabled = false;
      }
    }


    let unlockedSessionNoteId = null; // Lưu trạng thái Note đang được mở khóa tạm thời
    let isVaultLocking = false;

    // Face ID / Touch ID chỉ được gọi qua native iOS bridge (WKWebView).
    // Nếu chạy HTML thuần trong Safari/trình duyệt, hàm trả false và giữ luồng mật khẩu cũ.
    const pendingNoteBiometricRequests = new Map();
    let noteBiometricRequestSerial = 0;

    function requestNativeNoteBiometric() {
      const handler = window.webkit?.messageHandlers?.nevosBiometrics;
      if (!handler || typeof handler.postMessage !== 'function') return Promise.resolve(false);

      const requestId = `note-auth-${Date.now()}-${++noteBiometricRequestSerial}`;
      return new Promise(resolve => {
        let settled = false;
        const timeoutId = window.setTimeout(() => finish(false), 30000);

        function finish(success) {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeoutId);
          pendingNoteBiometricRequests.delete(requestId);
          resolve(success === true);
        }

        pendingNoteBiometricRequests.set(requestId, finish);
        try {
          handler.postMessage({ action: 'authenticateProtectedNote', requestId });
        } catch (err) {
          console.warn('Không gọi được native biometric bridge:', err);
          finish(false);
        }
      });
    }

    // Native iOS gọi lại hàm này sau khi LocalAuthentication hoàn tất.
    window.__nevosBiometricsDidFinish = function (result) {
      if (!result || typeof result.requestId !== 'string') return;
      const finish = pendingNoteBiometricRequests.get(result.requestId);
      if (finish) finish(result.success === true);
    };

    function isNoteLocked(note) {
      return Boolean(String(note?.secret ?? '').trim()) && unlockedSessionNoteId !== note.id;
    }

    function sortNotesArray() {
      // Keep pinned notes at the top and honor their deliberate drag order.
      // All remaining ties (including legacy pinned notes without pinOrder) sort by title,
      // never by updatedAt, so editing a note will not unexpectedly move it in the list.
      const compareTitle = (a, b) => {
        const titleA = String(a.title || 'Untitled').trim() || 'Untitled';
        const titleB = String(b.title || 'Untitled').trim() || 'Untitled';
        return titleA.localeCompare(titleB, 'vi', { sensitivity: 'base', numeric: true }) || String(a.id || '').localeCompare(String(b.id || ''));
      };
      decryptedNotes.sort((a, b) => {
        if (Boolean(b.pinned) !== Boolean(a.pinned)) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
        if (a.pinned && b.pinned) {
          const orderA = typeof a.pinOrder === 'number' ? a.pinOrder : Number.MAX_SAFE_INTEGER;
          const orderB = typeof b.pinOrder === 'number' ? b.pinOrder : Number.MAX_SAFE_INTEGER;
          if (orderA !== orderB) return orderA - orderB;
        }
        return compareTitle(a, b);
      });
    }

    async function migrateInlineAttachments(noteObj, rawRecord) {
      const sourceAttachments = Array.isArray(noteObj.attachments) ? noteObj.attachments : [];
      const needsNormalization = !Array.isArray(noteObj.attachments) || sourceAttachments.some(att =>
        !att || typeof att !== 'object' || typeof att.data === 'string' ||
        Object.keys(att).some(key => !['id', 'name', 'type', 'size'].includes(key)) ||
        typeof att.id !== 'string' || !att.id
      );
      if (!needsNormalization) return noteObj;

      const metadata = [];
      for (const att of sourceAttachments) {
        if (!att || typeof att !== 'object') continue;
        const id = typeof att.id === 'string' && att.id ? att.id : newAttachmentId();
        if (typeof att.data === 'string') {
          const encrypted = await encryptBinary(base64ToBuffer(att.data), masterCryptoKey, id);
          await dbPut('attachments', encrypted);
        }
        metadata.push(attachmentMetadata(att, id));
      }

      const migratedNote = { ...noteObj, attachments: metadata };
      const encryptedNote = await encryptObject(migratedNote, masterCryptoKey);
      await dbPut('notes', {
        id: migratedNote.id,
        updatedAt: migratedNote.updatedAt || rawRecord.updatedAt || Date.now(),
        iv: encryptedNote.iv,
        data: encryptedNote.data
      });
      return migratedNote;
    }

    async function loadAllNotesIntoRAM() {
      const rawRecords = await dbGetAll('notes');
      const list = [];
      for (const rec of rawRecords) {
        let noteObj;
        try {
          noteObj = await decryptObject(rec.iv, rec.data, masterCryptoKey);
        } catch (e) {
          console.error('Bỏ qua bản ghi lỗi:', rec.id);
          continue;
        }
        // Migration failures stop unlock rather than silently drop an attachment or note.
        noteObj = await migrateInlineAttachments(noteObj, rec);
        list.push(noteObj);
      }
      decryptedNotes = list;
      sortNotesArray();
    }
